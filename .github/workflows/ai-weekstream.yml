name: CGI AI Retail & Consumer Services Weekstream - source images HARD FIX

on:
  workflow_dispatch:
  schedule:
    # Iedere vrijdag om 07:30 Europe/Amsterdam.
    # Geen extra tijd-guard: als GitHub later start, publiceert hij alsnog.
    - cron: "30 7 * * 5"
      timezone: Europe/Amsterdam

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Installeer dependencies zonder requirements.txt
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade requests feedparser beautifulsoup4 pillow pillow-avif-plugin

      - name: Bouw weekstream met embedded bronafbeeldingen
        shell: bash
        env:
          MAX_ARTICLES: "28"
          LOOKBACK_HOURS: "168"
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import html
          import json
          import os
          import re
          import shutil
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from io import BytesIO
          from urllib.parse import urljoin, urlsplit, urlunsplit
          from zoneinfo import ZoneInfo

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps, ImageFile
          try:
              import pillow_avif  # noqa: F401
          except Exception:
              pass

          VERSION = "v11.0-embedded-source-images-dict-hardfix"
          ACCESS_CODE = "NT2026!"
          AMSTERDAM = ZoneInfo("Europe/Amsterdam")
          NOW = datetime.now(AMSTERDAM)
          UTC_NOW = datetime.now(timezone.utc)
          LOOKBACK_HOURS = int(os.environ.get("LOOKBACK_HOURS", "168"))
          MAX_ARTICLES = int(os.environ.get("MAX_ARTICLES", "28"))
          print(f"WORKFLOW_VERSION: {VERSION}", flush=True)

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          SOURCES = [
              {"name":"TechCrunch AI", "kind":"ai", "url":"https://techcrunch.com/category/artificial-intelligence/feed/"},
              {"name":"The Verge AI", "kind":"ai", "url":"https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"},
              {"name":"WIRED AI", "kind":"ai", "url":"https://www.wired.com/feed/tag/artificial-intelligence/latest/rss"},
              {"name":"MIT News AI", "kind":"ai", "url":"https://news.mit.edu/rss/topic/artificial-intelligence2"},
              {"name":"OpenAI News", "kind":"ai", "url":"https://openai.com/news/rss.xml"},
              {"name":"Google DeepMind Blog", "kind":"ai", "url":"https://deepmind.google/blog/rss.xml"},
              {"name":"Anthropic News", "kind":"ai", "url":"https://www.anthropic.com/news/rss.xml"},
              {"name":"VentureBeat AI", "kind":"ai", "url":"https://venturebeat.com/category/ai/feed/"},
              {"name":"The Decoder", "kind":"ai", "url":"https://the-decoder.com/feed/"},
              {"name":"NVIDIA Blog", "kind":"ai", "url":"https://blogs.nvidia.com/blog/category/deep-learning/feed/"},
              {"name":"Microsoft AI Blog", "kind":"ai", "url":"https://blogs.microsoft.com/ai/feed/"},
              {"name":"Retail Dive", "kind":"retail", "url":"https://www.retaildive.com/feeds/news/"},
              {"name":"Modern Retail", "kind":"retail", "url":"https://www.modernretail.co/feed/"},
              {"name":"RetailWire", "kind":"retail", "url":"https://retailwire.com/feed/"},
              {"name":"Grocery Dive", "kind":"retail", "url":"https://www.grocerydive.com/feeds/news/"},
              {"name":"Digital Commerce 360", "kind":"retail", "url":"https://www.digitalcommerce360.com/feed/"},
              {"name":"NRF", "kind":"retail", "url":"https://nrf.com/rss.xml"},
          ]

          def normalise_source(source):
              # Hardening: older pasted versions used tuples, newer versions use dicts.
              # This function avoids any fragile `for name, url in SOURCES` unpacking.
              if isinstance(source, dict):
                  return {
                      "name": source.get("name", "Unknown source"),
                      "kind": source.get("kind", "ai"),
                      "url": source.get("url", ""),
                  }
              if isinstance(source, (list, tuple)):
                  if len(source) == 2:
                      name, url = source
                      return {"name": str(name), "kind": "ai", "url": str(url)}
                  if len(source) >= 3:
                      name, kind, url = source[0], source[1], source[2]
                      return {"name": str(name), "kind": str(kind), "url": str(url)}
              raise ValueError(f"Invalid source definition: {source!r}")

          def iter_sources():
              for source in SOURCES:
                  normalised = normalise_source(source)
                  if normalised["url"]:
                      yield normalised

          AI_TERMS = ["ai", "artificial intelligence", "genai", "generative ai", "llm", "language model", "foundation model", "agent", "agents", "automation", "machine learning", "deep learning", "computer vision", "copilot", "chatbot", "robotics", "model", "openai", "anthropic", "gemini", "claude"]
          RETAIL_TERMS = ["retail", "consumer", "commerce", "ecommerce", "e-commerce", "store", "stores", "shopper", "customer", "loyalty", "personalization", "supply chain", "inventory", "pricing", "merchandising", "marketplace", "grocery", "fulfillment", "last-mile", "omnichannel", "checkout", "retail media"]
          TECH_RETAIL_TERMS = ["ai", "automation", "data", "digital", "technology", "platform", "cloud", "analytics", "personalization", "loyalty", "commerce", "ecommerce", "supply chain", "inventory", "pricing", "forecast", "media", "marketplace"]

          TOPICS = [
              ("retail", "Retail & Consumer Services", RETAIL_TERMS),
              ("agents", "AI Agents & Automation", ["agent", "agents", "autonomous", "workflow", "automation", "copilot"]),
              ("models", "GenAI & Foundation Models", ["model", "foundation", "llm", "language model", "multimodal", "gemini", "claude", "gpt", "openai", "deepmind", "anthropic"]),
              ("customer", "Customer & Loyalty", ["customer", "shopper", "loyalty", "personalization", "experience", "crm", "recommendation"]),
              ("stores", "Store Operations", ["store", "stores", "checkout", "associate", "workforce", "robot", "shelf", "in-store"]),
              ("supply", "Supply Chain & Forecasting", ["supply chain", "inventory", "forecast", "demand", "warehouse", "fulfillment", "logistics"]),
              ("pricing", "Pricing & Merchandising", ["pricing", "price", "promotion", "merchandising", "assortment", "markdown"]),
              ("data", "Data, Platforms & Cloud", ["data", "platform", "cloud", "api", "infrastructure", "chip", "gpu", "database"]),
              ("governance", "Governance, Risk & Responsible AI", ["governance", "risk", "responsible", "safety", "security", "privacy", "regulation", "policy", "copyright"]),
              ("research", "Research & Market Signals", ["research", "paper", "benchmark", "study", "report", "trend", "funding", "startup"]),
          ]

          BAD_IMAGE_WORDS = ["logo", "favicon", "icon", "sprite", "avatar", "author", "profile", "placeholder", "blank", "transparent", "pixel", "tracking", "badge", "app-store", "play-store", "newsletter", "ad-"]
          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9,nl;q=0.8",
          })

          def log(msg):
              print(msg, flush=True)

          def ensure_dir(path):
              os.makedirs(path, exist_ok=True)

          def h(value):
              return html.escape(str(value or ""), quote=True)

          def clean_text(value):
              if not value:
                  return ""
              text = BeautifulSoup(str(value), "html.parser").get_text(" ")
              text = html.unescape(text)
              return re.sub(r"\s+", " ", text).strip()

          def dedupe(items):
              seen = set()
              out = []
              for item in items:
                  if not item:
                      continue
                  item = str(item).strip()
                  if item and item not in seen:
                      seen.add(item)
                      out.append(item)
              return out

          def canonical_url(url):
              try:
                  parts = urlsplit(url)
                  return urlunsplit((parts.scheme, parts.netloc, parts.path.rstrip("/"), "", "")).lower()
              except Exception:
                  return (url or "").lower()

          def abs_url(url, base):
              if not url:
                  return ""
              url = html.unescape(str(url)).strip().strip('"\'')
              if url.startswith("//"):
                  return "https:" + url
              return urljoin(base, url)

          def parse_entry_date(entry):
              for key in ["published_parsed", "updated_parsed", "created_parsed"]:
                  value = entry.get(key)
                  if value:
                      try:
                          return datetime(*value[:6], tzinfo=timezone.utc)
                      except Exception:
                          pass
              for key in ["published", "updated", "created"]:
                  value = entry.get(key)
                  if value:
                      try:
                          dt = parsedate_to_datetime(value)
                          if dt.tzinfo is None:
                              dt = dt.replace(tzinfo=timezone.utc)
                          return dt.astimezone(timezone.utc)
                      except Exception:
                          pass
              return None

          def likely_bad_image_url(url):
              low = (url or "").lower()
              if not low or low.startswith("data:"):
                  return True
              return any(word in low for word in BAD_IMAGE_WORDS)

          def parse_srcset(srcset, base):
              candidates = []
              for part in (srcset or "").split(","):
                  bits = part.strip().split()
                  if not bits:
                      continue
                  url = abs_url(bits[0], base)
                  score = 0
                  if len(bits) > 1:
                      m = re.search(r"(\d+)", bits[1])
                      if m:
                          score = int(m.group(1))
                  candidates.append((score, url))
              candidates.sort(reverse=True)
              return [u for _, u in candidates]

          def feed_image_candidates(entry, base_url):
              urls = []
              for field in ["media_thumbnail", "media_content"]:
                  for media in entry.get(field, []) or []:
                      if isinstance(media, dict):
                          url = media.get("url")
                          medium = (media.get("medium") or "").lower()
                          typ = (media.get("type") or "").lower()
                          if url and (field == "media_thumbnail" or medium == "image" or "image" in typ or not typ):
                              urls.append(abs_url(url, base_url))
              for link in entry.get("links", []) or []:
                  if isinstance(link, dict):
                      typ = (link.get("type") or "").lower()
                      rel = (link.get("rel") or "").lower()
                      href = link.get("href")
                      if href and ("image" in typ or rel in ["enclosure", "image_src"]):
                          urls.append(abs_url(href, base_url))
              for key in ["summary", "description"]:
                  fragment = entry.get(key)
                  if fragment:
                      soup = BeautifulSoup(str(fragment), "html.parser")
                      for img in soup.find_all("img"):
                          if img.get("srcset"):
                              urls.extend(parse_srcset(img.get("srcset"), base_url))
                          for attr in ["src", "data-src", "data-original", "data-lazy-src"]:
                              if img.get(attr):
                                  urls.append(abs_url(img.get(attr), base_url))
              return dedupe([u for u in urls if not likely_bad_image_url(u)])

          def json_find_images(obj):
              found = []
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if str(key).lower() == "image":
                          if isinstance(value, str):
                              found.append(value)
                          elif isinstance(value, list):
                              for item in value:
                                  if isinstance(item, str):
                                      found.append(item)
                                  elif isinstance(item, dict) and isinstance(item.get("url"), str):
                                      found.append(item["url"])
                          elif isinstance(value, dict) and isinstance(value.get("url"), str):
                              found.append(value["url"])
                      else:
                          found.extend(json_find_images(value))
              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(json_find_images(item))
              return found

          def article_image_candidates(article_url):
              urls = []
              status = "not_fetched"
              try:
                  response = SESSION.get(article_url, timeout=22, allow_redirects=True, headers={"Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"})
                  status = f"{response.status_code} {response.headers.get('content-type','')}"
                  response.raise_for_status()
                  page_url = response.url
                  soup = BeautifulSoup(response.text, "html.parser")
              except Exception as exc:
                  return [], f"article_fetch_failed:{type(exc).__name__}:{str(exc)[:160]}"

              for attrs in [
                  {"property":"og:image"}, {"property":"og:image:url"}, {"property":"og:image:secure_url"},
                  {"name":"twitter:image"}, {"name":"twitter:image:src"}
              ]:
                  for meta in soup.find_all("meta", attrs=attrs):
                      if meta.get("content"):
                          urls.append(abs_url(meta.get("content"), page_url))

              for link in soup.find_all("link"):
                  rel = " ".join(link.get("rel") or []).lower() if isinstance(link.get("rel"), list) else str(link.get("rel") or "").lower()
                  if "image_src" in rel and link.get("href"):
                      urls.append(abs_url(link.get("href"), page_url))

              for script in soup.find_all("script", attrs={"type":"application/ld+json"}):
                  raw = script.string or script.get_text() or ""
                  try:
                      data = json.loads(raw)
                      for img in json_find_images(data):
                          urls.append(abs_url(img, page_url))
                  except Exception:
                      for match in re.finditer(r"['\"]image['\"]\s*:\s*['\"]([^'\"]+)['\"]", raw, re.I):
                          urls.append(abs_url(match.group(1), page_url))

              # Extra fallback: eerste grote content-achtige image op de bronpagina.
              for img in soup.find_all("img")[:80]:
                  if img.get("srcset"):
                      urls.extend(parse_srcset(img.get("srcset"), page_url))
                  attrs = " ".join([str(img.get(a) or "") for a in ["src", "data-src", "data-original", "data-lazy-src", "class", "alt"]])
                  looks_content = re.search(r"(article|hero|lead|main|photo|image|media|wp-content|uploads|cdn|asset)", attrs, re.I)
                  width = img.get("width") or ""
                  if looks_content or re.match(r"^[4-9]\d{2,}$", str(width)):
                      for attr in ["src", "data-src", "data-original", "data-lazy-src"]:
                          if img.get(attr):
                              urls.append(abs_url(img.get(attr), page_url))

              return dedupe([u for u in urls if not likely_bad_image_url(u)]), status

          def encode_source_image(image_url, article_url):
              reasons = []
              try:
                  headers = {
                      "Accept": "image/avif,image/webp,image/apng,image/jpeg,image/png,image/*,*/*;q=0.8",
                      "Referer": article_url,
                  }
                  response = SESSION.get(image_url, timeout=28, allow_redirects=True, headers=headers)
                  ctype = response.headers.get("content-type", "")
                  final_url = response.url
                  if response.status_code >= 400:
                      return None, {"url": image_url, "status": f"http_{response.status_code}", "content_type": ctype}
                  data = response.content
                  if len(data) < 9000:
                      return None, {"url": image_url, "status": f"too_small_bytes_{len(data)}", "content_type": ctype}
                  if "image" not in ctype.lower() and not re.search(r"\.(jpe?g|png|webp|gif|avif)(\?|$)", final_url.lower()):
                      return None, {"url": image_url, "status": f"not_image_{ctype[:80]}", "content_type": ctype}

                  img = Image.open(BytesIO(data))
                  if getattr(img, "is_animated", False):
                      img.seek(0)
                  img.load()
                  original_size = img.size
                  if original_size[0] < 420 or original_size[1] < 220:
                      return None, {"url": image_url, "status": f"image_too_small_{original_size[0]}x{original_size[1]}", "content_type": ctype}
                  img = img.convert("RGB")
                  img = ImageOps.fit(img, (960, 540), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  out = BytesIO()
                  img.save(out, format="JPEG", quality=78, optimize=True, progressive=True)
                  encoded = base64.b64encode(out.getvalue()).decode("ascii")
                  return {
                      "data_uri": "data:image/jpeg;base64," + encoded,
                      "original_url": final_url,
                      "original_content_type": ctype,
                      "original_bytes": len(data),
                      "original_size": original_size,
                      "embedded_bytes": len(out.getvalue()),
                  }, None
              except Exception as exc:
                  return None, {"url": image_url, "status": f"exception_{type(exc).__name__}:{str(exc)[:180]}"}

          def select_embedded_source_image(candidates, article_url):
              # IMPORTANT: return a dict, never a tuple.
              # This prevents the recurring "too many values to unpack" crash.
              reasons = []
              unique_candidates = dedupe(candidates)[:20]
              for image_url in unique_candidates:
                  if likely_bad_image_url(image_url):
                      reasons.append({"url": image_url, "status": "skipped_bad_url"})
                      continue
                  result, reason = encode_source_image(image_url, article_url)
                  if result:
                      result["attempted_candidates"] = len(candidates)
                      result["failed_before_success"] = reasons[:8]
                      return {"ok": True, "image": result, "reasons": reasons[:8]}
                  reasons.append(reason)
              return {"ok": False, "image": None, "reasons": reasons[:14]}

          def relevance(item):
              text = f"{item['title']} {item.get('summary','')} {' '.join(item.get('categories',[]))}".lower()
              ai = sum(1 for term in AI_TERMS if term in text)
              retail = sum(1 for term in RETAIL_TERMS if term in text)
              techretail = sum(1 for term in TECH_RETAIL_TERMS if term in text)
              if item["source_kind"] == "ai" and ai < 1:
                  return 0, ai, retail
              if item["source_kind"] == "retail" and techretail < 1:
                  return 0, ai, retail
              score = ai * 3 + retail * 2 + techretail + (3 if item["source_kind"] == "retail" else 0)
              return score, ai, retail

          def classify(item):
              text = f"{item['title']} {item.get('summary','')} {' '.join(item.get('categories',[]))}".lower()
              topics = []
              for tid, label, terms in TOPICS:
                  if any(term in text for term in terms):
                      topics.append({"id": tid, "label": label})
              if not topics:
                  topics.append({"id": "research", "label": "Research & Market Signals"})
              return topics[:4]

          def cgi_angle(item, topics):
              topic_ids = {topic["id"] for topic in topics}
              if "retail" in topic_ids and ("customer" in topic_ids or "pricing" in topic_ids):
                  return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan klantwaarde, personalisatie, commerciële besluitvorming en de manier waarop retailers AI vertalen naar concrete omnichannel proposities."
              if "supply" in topic_ids or "stores" in topic_ids:
                  return "Relevant voor CGI Retail & Consumer Services omdat dit aanknopingspunten geeft voor gesprekken over operationele efficiency, store execution, forecast accuracy en schaalbare AI in de dagelijkse retailoperatie."
              if "governance" in topic_ids:
                  return "Relevant voor CGI omdat klanten AI sneller willen opschalen, maar daarbij vragen hebben over governance, risico, security, compliance en verantwoord gebruik in bestaande IT- en datalandschappen."
              if "data" in topic_ids:
                  return "Relevant voor CGI omdat succesvolle AI-adoptie sterk afhankelijk is van datavolwassenheid, platformkeuzes, integratiearchitectuur en cloud-infrastructuur bij retail- en consumer-services-klanten."
              if "agents" in topic_ids or "models" in topic_ids:
                  return "Relevant voor CGI omdat nieuwe model- en agentontwikkelingen invloed hebben op klantverwachtingen, delivery-aanpak, automatiseringskansen en toekomstige AI-proposities voor retail- en consumer-services-klanten."
              return "Relevant om te volgen voor CGI Retail & Consumer Services als markt- en technologiesignaal: het helpt het team scherp te blijven op AI-ontwikkelingen die klantvragen, vendor-roadmaps en proposities kunnen beïnvloeden."

          def article_summary(item):
              text = item.get("summary", "")
              if len(text) > 245:
                  text = text[:242].rsplit(" ", 1)[0] + "..."
              if len(text) < 60:
                  text = "Een relevant signaal uit de internationale AI- en retailnieuwsstroom. Open het bronartikel voor de volledige context en details."
              return text

          def fmt_date(dt):
              if not dt:
                  return "Datum onbekend"
              return dt.astimezone(AMSTERDAM).strftime("%d %b %Y")

          def collect_feed(source):
              log(f"FEED: {source['name']} | {source['url']}")
              status = {"source": source["name"], "ok": False, "url": source["url"], "count": 0}
              try:
                  parsed = feedparser.parse(source["url"], request_headers={"User-Agent": SESSION.headers["User-Agent"]})
                  entries = parsed.entries or []
                  status.update({"ok": True, "count": len(entries), "bozo": bool(getattr(parsed, "bozo", False))})
              except Exception as exc:
                  status["error"] = f"{type(exc).__name__}:{str(exc)[:160]}"
                  return [], status

              items = []
              for entry in entries[:45]:
                  title = clean_text(entry.get("title", ""))
                  link = entry.get("link") or ""
                  if not title or not link:
                      continue
                  summary = clean_text(entry.get("summary", "") or entry.get("description", ""))
                  categories = []
                  for tag in entry.get("tags", []) or []:
                      term = clean_text(tag.get("term", "")) if isinstance(tag, dict) else clean_text(str(tag))
                      if term:
                          categories.append(term)
                  published = parse_entry_date(entry)
                  items.append({
                      "source": source["name"],
                      "source_kind": source["kind"],
                      "title": title,
                      "url": link,
                      "summary": summary,
                      "published": published,
                      "categories": dedupe(categories),
                      "feed_image_candidates": feed_image_candidates(entry, link),
                  })
              return items, status

          # Build content
          if os.path.exists("site"):
              shutil.rmtree("site")
          ensure_dir("site")

          feed_status = []
          all_items = []
          for source in iter_sources():
              items, status = collect_feed(source)
              feed_status.append(status)
              all_items.extend(items)
              time.sleep(0.15)

          seen = set()
          unique = []
          for item in all_items:
              key = canonical_url(item["url"])
              if key in seen:
                  continue
              seen.add(key)
              unique.append(item)

          cutoff = UTC_NOW - timedelta(hours=LOOKBACK_HOURS)
          relevant = []
          for item in unique:
              if item.get("published") and item["published"] < cutoff:
                  continue
              score, ai_score, retail_score = relevance(item)
              if score <= 0:
                  continue
              item["score"] = score
              item["ai_score"] = ai_score
              item["retail_score"] = retail_score
              relevant.append(item)

          relevant.sort(key=lambda item: (item.get("score", 0), item.get("published") or datetime(1970, 1, 1, tzinfo=timezone.utc)), reverse=True)

          accepted = []
          rejected = []
          for item in relevant[:110]:
              candidates = list(item.get("feed_image_candidates") or [])
              page_candidates, page_status = article_image_candidates(item["url"])
              candidates.extend(page_candidates)
              selection = select_embedded_source_image(candidates, item["url"])
              image = selection.get("image")
              reasons = selection.get("reasons", [])
              if selection.get("ok") and image:
                  item["topics"] = classify(item)
                  item["summary_final"] = article_summary(item)
                  item["cgi_angle"] = cgi_angle(item, item["topics"])
                  item["image_data_uri"] = image["data_uri"]
                  item["image_original_url"] = image["original_url"]
                  item["image_original_content_type"] = image["original_content_type"]
                  item["image_original_bytes"] = image["original_bytes"]
                  item["image_embedded_bytes"] = image["embedded_bytes"]
                  accepted.append(item)
                  log(f"SOURCE IMAGE EMBEDDED: {item['source']} | {item['title'][:80]}")
              else:
                  rejected.append({"title": item["title"], "source": item["source"], "url": item["url"], "article_page_status": page_status, "candidate_count": len(candidates), "reasons": reasons})
                  log(f"REJECTED WITHOUT SOURCE IMAGE: {item['source']} | {item['title'][:80]}")
              if len(accepted) >= MAX_ARTICLES:
                  break

          topic_counts = {}
          for item in accepted:
              for topic in item.get("topics", []):
                  topic_counts[topic["label"]] = topic_counts.get(topic["label"], 0) + 1
          top_topics = [label for label, count in sorted(topic_counts.items(), key=lambda kv: kv[1], reverse=True)[:3]]
          if accepted and top_topics:
              week_summary = "Deze week laat de internationale AI-nieuwsstroom vooral beweging zien rond " + ", ".join(t.lower() for t in top_topics) + ". Voor CGI Retail & Consumer Services zijn vooral artikelen relevant die raken aan klantinteractie, operationele retailprocessen, dataplatformen, governance en de vertaling van AI naar schaalbare klantoplossingen."
          elif accepted:
              week_summary = "Deze week zijn er meerdere relevante AI- en retailontwikkelingen gevonden met bruikbare bronafbeeldingen. Gebruik de filters om per thema door de briefing te gaan."
          else:
              week_summary = "Er zijn deze run geen artikelen gepubliceerd, omdat geen enkel relevant artikel een bronafbeelding opleverde die succesvol kon worden gedownload en in de HTML kon worden ingebed."

          def render_cards(items, grid_id=None):
              cards = []
              for item in items:
                  topics = item.get("topics", [])
                  topic_ids = " ".join(topic["id"] for topic in topics)
                  tags = "".join(f'<button class="tag" data-filter="{h(topic["id"])}">{h(topic["label"])}</button>' for topic in topics)
                  cards.append(f'''
                  <article class="card" data-topics="{h(topic_ids)}">
                    <div class="visual">
                      <img src="{item['image_data_uri']}" alt="Bronafbeelding bij {h(item['title'])}" loading="lazy">
                      <div class="image-badge">Bronafbeelding · embedded</div>
                    </div>
                    <div class="card-body">
                      <div class="meta"><span>{h(item['source'])}</span><span>{h(fmt_date(item.get('published')))}</span></div>
                      <h3>{h(item['title'])}</h3>
                      <p class="summary">{h(item['summary_final'])}</p>
                      <div class="angle"><strong>CGI Angle:</strong> {h(item['cgi_angle'])}</div>
                      <div class="tags">{tags}</div>
                      <a class="source-button" href="{h(item['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel →</a>
                    </div>
                  </article>''')
              return "\n".join(cards)

          filter_buttons = ['<button class="filter active" data-filter="all">Alle artikelen</button>']
          for topic_id, label, terms in TOPICS:
              count = sum(1 for item in accepted if any(topic["id"] == topic_id for topic in item.get("topics", [])))
              if count:
                  filter_buttons.append(f'<button class="filter" data-filter="{h(topic_id)}">{h(label)} <span>{count}</span></button>')
          filters_html = "\n".join(filter_buttons)
          all_cards = render_cards(accepted)
          retail_items = [item for item in accepted if any(topic["id"] == "retail" for topic in item.get("topics", []))]
          retail_cards = render_cards(retail_items or accepted[:6])
          generated = NOW.strftime("%d %B %Y %H:%M")
          status = {
              "version": VERSION,
              "generated_at": NOW.isoformat(),
              "lookback_hours": LOOKBACK_HOURS,
              "articles_published": len(accepted),
              "source_images_embedded": len(accepted),
              "fallback_visuals": 0,
              "strict_source_images": True,
              "image_pipeline": "download_source_image_convert_to_jpg_embed_as_data_uri",
              "no_external_image_paths": True,
              "articles_rejected_without_source_image": len(rejected),
              "feed_status": feed_status,
              "published_images": [{"title": item["title"], "source": item["source"], "page_url": item["url"], "source_image_url": item["image_original_url"], "embedded_bytes": item["image_embedded_bytes"]} for item in accepted],
              "rejected_without_source_image_sample": rejected[:25],
          }

          status_json_escaped = h(json.dumps(status, ensure_ascii=False, indent=2, default=str))
          page_note = "Iedere zichtbare artikelkaart gebruikt een echte bronafbeelding die tijdens de workflow is gedownload, naar JPG is geconverteerd en direct in deze HTML is ingebed. Er zijn geen losse image-paden meer die op GitHub Pages kunnen breken."
          if not accepted:
              cards_section = f'''<section class="section panel warning"><h2>Geen artikelen gepubliceerd</h2><p>{h(week_summary)}</p><p>Open <code>status.json</code> voor de technische redenen per artikel.</p></section>'''
          else:
              cards_section = f'''
                <section class="section">
                  <h2>Alle relevante artikelen</h2>
                  <div class="grid" id="articleGrid">{all_cards}</div>
                  <div class="empty" id="empty">Geen artikelen binnen dit filter.</div>
                </section>
                <section class="section">
                  <h2>Retail & Consumer Services: relevante artikelen</h2>
                  <div class="grid">{retail_cards}</div>
                </section>'''

          html_doc = f'''<!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="pragma" content="no-cache">
            <meta http-equiv="expires" content="0">
            <title>CGI AI & Retail Weekstream</title>
            <style>
              :root {{ --cgi-red:#e31937; --cgi-purple:#5236ab; --cgi-black:#000; --cgi-white:#fff; --soft:#f6f4f7; --line:#e8e3eb; --text:#111; --muted:#5f5a66; }}
              * {{ box-sizing:border-box; }}
              body {{ margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--text); background:linear-gradient(180deg,#fff 0,#faf8fb 100%); }}
              .locked {{ overflow:hidden; }}
              .login {{ position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple)); padding:24px; }}
              .login-card {{ width:min(520px,100%); background:#fff; border-radius:28px; padding:32px; box-shadow:0 30px 80px rgba(0,0,0,.28); }}
              .logo {{ font-weight:900; letter-spacing:-2px; font-size:42px; color:var(--cgi-red); }}
              .login h1 {{ margin:12px 0 8px; font-size:28px; }}
              .login p {{ color:var(--muted); line-height:1.55; }}
              .login input {{ width:100%; padding:16px 18px; border:2px solid var(--line); border-radius:14px; font-size:18px; margin:12px 0; }}
              .login button, .source-button, .filter.active {{ background:var(--cgi-red); color:#fff; }}
              .login button {{ width:100%; border:0; padding:15px 18px; border-radius:999px; font-weight:800; font-size:16px; cursor:pointer; }}
              .error {{ color:var(--cgi-red); font-weight:700; display:none; }}
              .page {{ display:none; }}
              header {{ background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple)); color:#fff; padding:42px 24px 52px; }}
              .wrap {{ max-width:1180px; margin:0 auto; }}
              .topline {{ display:flex; justify-content:space-between; gap:24px; align-items:flex-start; flex-wrap:wrap; }}
              .brand {{ font-weight:900; font-size:46px; letter-spacing:-2px; }}
              .badge {{ display:inline-flex; padding:9px 13px; border:1px solid rgba(255,255,255,.35); border-radius:999px; font-size:13px; background:rgba(255,255,255,.12); }}
              h1 {{ font-size:clamp(34px,6vw,68px); line-height:.95; letter-spacing:-3px; max-width:900px; margin:34px 0 18px; }}
              .sub {{ max-width:860px; color:rgba(255,255,255,.9); font-size:18px; line-height:1.55; }}
              .stats {{ margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; }}
              .stat {{ background:#fff; color:#000; border-radius:18px; padding:16px 20px; min-width:170px; }}
              .stat strong {{ display:block; font-size:28px; }}
              main {{ padding:34px 24px 70px; }}
              .section {{ margin:0 auto 34px; max-width:1180px; }}
              .panel {{ background:#fff; border:1px solid var(--line); border-radius:26px; padding:26px; box-shadow:0 10px 30px rgba(36,20,50,.06); }}
              .panel h2, .section h2 {{ margin:0 0 12px; font-size:30px; letter-spacing:-1px; }}
              .panel p {{ margin:0 0 10px; color:var(--muted); line-height:1.65; font-size:17px; }}
              .warning {{ border-color:#e31937; }}
              .filters {{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }}
              .filter {{ border:1px solid var(--line); background:#fff; color:#111; border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:700; }}
              .filter span {{ opacity:.65; margin-left:4px; }}
              .grid {{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }}
              .card {{ background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:0 12px 28px rgba(36,20,50,.07); display:flex; flex-direction:column; min-width:0; }}
              .visual {{ position:relative; width:100%; aspect-ratio:16/9; background:#e9e6ee; overflow:hidden; }}
              .visual img {{ width:100%; height:100%; object-fit:cover; display:block; }}
              .image-badge {{ position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,.72); color:#fff; border-radius:999px; padding:7px 10px; font-size:12px; font-weight:800; }}
              .card-body {{ padding:18px; display:flex; flex-direction:column; gap:12px; flex:1; }}
              .meta {{ display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; text-transform:uppercase; font-weight:800; letter-spacing:.04em; }}
              h3 {{ margin:0; font-size:20px; line-height:1.18; letter-spacing:-.3px; }}
              .summary {{ margin:0; color:#3d3745; line-height:1.5; }}
              .angle {{ background:#f8f5fa; border-left:4px solid var(--cgi-purple); border-radius:14px; padding:12px; line-height:1.45; color:#2d2638; }}
              .tags {{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }}
              .tag {{ border:1px solid #e4dcea; background:#fff; color:#5236ab; padding:7px 9px; border-radius:999px; font-size:12px; font-weight:800; cursor:pointer; }}
              .source-button {{ display:inline-flex; justify-content:center; align-items:center; text-decoration:none; border-radius:999px; padding:12px 16px; font-weight:900; margin-top:2px; box-shadow:0 8px 18px rgba(227,25,55,.18); }}
              .source-button:hover {{ transform:translateY(-1px); }}
              .empty {{ display:none; padding:30px; text-align:center; color:var(--muted); }}
              details {{ max-width:1180px; margin:0 auto 34px; }}
              summary {{ cursor:pointer; font-weight:800; }}
              pre {{ white-space:pre-wrap; background:#111; color:#fff; padding:18px; border-radius:18px; overflow:auto; max-height:420px; }}
              footer {{ border-top:1px solid var(--line); padding:28px 24px; color:var(--muted); font-size:14px; }}
              @media (max-width:950px) {{ .grid {{ grid-template-columns:repeat(2,minmax(0,1fr)); }} }}
              @media (max-width:640px) {{ header {{ padding:28px 18px 36px; }} main {{ padding:24px 14px 50px; }} .grid {{ grid-template-columns:1fr; }} .panel {{ padding:20px; }} .brand {{ font-size:36px; }} .meta {{ flex-direction:column; gap:4px; }} }}
            </style>
          </head>
          <body class="locked">
            <div class="login" id="login">
              <div class="login-card">
                <div class="logo">CGI</div>
                <h1>AI & Retail Weekstream</h1>
                <p>Voer de toegangscode in om de briefing te openen.</p>
                <input id="code" type="password" placeholder="Toegangscode" autocomplete="current-password">
                <button id="unlock">Open briefing</button>
                <p class="error" id="error">Onjuiste toegangscode.</p>
              </div>
            </div>
            <div class="page" id="page">
              <header>
                <div class="wrap">
                  <div class="topline"><div class="brand">CGI</div><div class="badge">{VERSION}</div></div>
                  <h1>AI & Retail Weekstream</h1>
                  <p class="sub">Wekelijkse selectie van internationale AI-ontwikkelingen en Retail & Consumer Services-signalen. {h(page_note)}</p>
                  <div class="stats"><div class="stat"><strong>{len(accepted)}</strong> relevante artikelen</div></div>
                </div>
              </header>
              <main>
                <section class="section panel">
                  <h2>Weeksamenvatting</h2>
                  <p>{h(week_summary)}</p>
                </section>
                <section class="section panel">
                  <h2>Filter op topic</h2>
                  <div class="filters">{filters_html}</div>
                </section>
                {cards_section}
                <details><summary>Technische beeldstatus</summary><pre>{status_json_escaped}</pre></details>
              </main>
              <footer><div class="wrap">Gegenereerd op {h(generated)} Europe/Amsterdam · Bronafbeeldingen zijn embedded in deze HTML, dus er zijn geen losse afbeeldingbestanden of relatieve paden.</div></footer>
            </div>
            <script>
              const ACCESS_CODE = {json.dumps(ACCESS_CODE)};
              const login = document.getElementById('login');
              const page = document.getElementById('page');
              const code = document.getElementById('code');
              const err = document.getElementById('error');
              function showPage() {{ login.style.display='none'; page.style.display='block'; document.body.classList.remove('locked'); }}
              if (localStorage.getItem('cgi_weekstream_access') === 'ok') showPage();
              document.getElementById('unlock').addEventListener('click', () => {{ if (code.value === ACCESS_CODE) {{ localStorage.setItem('cgi_weekstream_access','ok'); showPage(); }} else {{ err.style.display='block'; }} }});
              code.addEventListener('keydown', e => {{ if (e.key === 'Enter') document.getElementById('unlock').click(); }});
              function applyFilter(topic) {{
                document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === topic));
                let shown = 0;
                document.querySelectorAll('#articleGrid .card').forEach(card => {{
                  const topics = (card.dataset.topics || '').split(' ');
                  const visible = topic === 'all' || topics.includes(topic);
                  card.style.display = visible ? '' : 'none';
                  if (visible) shown++;
                }});
                const empty = document.getElementById('empty');
                if (empty) empty.style.display = shown ? 'none' : 'block';
              }}
              document.querySelectorAll('.filter,.tag').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter || 'all')));
            </script>
          </body>
          </html>'''

          def write_dest(dest):
              ensure_dir(dest)
              with open(os.path.join(dest, "index.html"), "w", encoding="utf-8") as f:
                  f.write(html_doc)
              with open(os.path.join(dest, "status.json"), "w", encoding="utf-8") as f:
                  json.dump(status, f, ensure_ascii=False, indent=2, default=str)
              with open(os.path.join(dest, "DEPLOYMENT_CHECK.txt"), "w", encoding="utf-8") as f:
                  f.write(f"{VERSION}\nPublished articles: {len(accepted)}\nSource images embedded: {len(accepted)}\nFallback visuals: 0\nNo external image paths: true\n")

          write_dest("site")
          write_dest("site/latest")
          archive_dir = os.path.join("site", "archive", NOW.strftime("%G-W%V"))
          write_dest(archive_dir)
          log(f"DONE: published={len(accepted)} embedded_source_images={len(accepted)} rejected_without_image={len(rejected)}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
