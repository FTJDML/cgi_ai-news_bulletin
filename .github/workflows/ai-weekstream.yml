name: CGI AI & IT Retail & Consumer Services Weekstream - v16 strict 7-day filter

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 5"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cgi-ai-rcs-weekstream
  cancel-in-progress: true

