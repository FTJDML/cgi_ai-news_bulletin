name: CGI AI Retail & Consumer Services Weekstream - FINAL source images

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 5"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cgi-ai-weekstream-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Build static weekstream with embedded source images
        run: |
          python3 - <<'PY'
          import base64
          import datetime as dt
          import email.utils
          import html
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          VERSION = "v12.0-final-source-images-embedded"
          ACCESS_CODE = "NT2026!"
          LOOKBACK_HOURS = 168
          MAX_ITEMS_PER_SOURCE = 18
          MAX_ARTICLES = 60
          MIN_IMAGE_BYTES = 3500
          MAX_IMAGE_BYTES = 1400000
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36 "
              "CGI-AI-Weekstream/12.0"
          )

          FEEDS = [
              {"source": "TechCrunch AI", "url": "https://techcrunch.com/category/artificial-intelligence/feed/", "kind": "ai"},
              {"source": "The Verge AI", "url": "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", "kind": "ai"},
              {"source": "WIRED AI", "url": "https://www.wired.com/feed/tag/artificial-intelligence/latest/rss", "kind": "ai"},
              {"source": "OpenAI News", "url": "https://openai.com/news/rss.xml", "kind": "ai"},
              {"source": "Google DeepMind Blog", "url": "https://deepmind.google/blog/rss.xml", "kind": "ai"},
              {"source": "VentureBeat AI", "url": "https://venturebeat.com/category/ai/feed/", "kind": "ai"},
              {"source": "The Decoder", "url": "https://the-decoder.com/feed/", "kind": "ai"},
              {"source": "NVIDIA Blog", "url": "https://blogs.nvidia.com/blog/category/deep-learning/feed/", "kind": "ai"},
              {"source": "Retail Dive", "url": "https://www.retaildive.com/feeds/news/", "kind": "retail"},
              {"source": "Modern Retail", "url": "https://www.modernretail.co/feed/", "kind": "retail"},
              {"source": "RetailWire", "url": "https://retailwire.com/feed/", "kind": "retail"},
              {"source": "Grocery Dive", "url": "https://www.grocerydive.com/feeds/news/", "kind": "retail"},
              {"source": "Digital Commerce 360", "url": "https://www.digitalcommerce360.com/feed/", "kind": "retail"},
              {"source": "NRF", "url": "https://nrf.com/rss.xml", "kind": "retail"},
          ]

          TOPIC_DEFS = [
              ("Retail & Consumer Services", ["retail", "consumer", "commerce", "store", "shopper", "customer", "loyalty", "grocery", "merchandising", "marketplace", "ecommerce", "omnichannel", "fulfillment"]),
              ("AI Agents & Automation", ["agent", "agents", "automation", "autonomous", "workflow", "copilot", "assistant"]),
              ("GenAI & Foundation Models", ["generative", "genai", "foundation model", "llm", "model", "multimodal", "chatgpt", "claude", "gemini", "openai", "deepmind"]),
              ("Customer & Loyalty", ["customer", "loyalty", "personalization", "personalisation", "recommendation", "experience", "cx", "crm"]),
              ("Store Operations", ["store", "checkout", "associate", "workforce", "inventory", "shelf", "loss prevention", "service"]),
              ("Supply Chain & Forecasting", ["supply chain", "forecast", "forecasting", "demand", "warehouse", "logistics", "inventory"]),
              ("Pricing & Merchandising", ["pricing", "promotion", "merchandising", "markdown", "assortment", "retail media", "advertising"]),
              ("Data, Platforms & Cloud", ["data", "platform", "cloud", "api", "infrastructure", "chip", "gpu", "nvidia", "database"]),
              ("Governance, Risk & Responsible AI", ["governance", "risk", "responsible", "safety", "security", "privacy", "regulation", "compliance", "trust"]),
              ("Research & Market Signals", ["research", "paper", "benchmark", "study", "report", "funding", "startup", "market"]),
          ]

          AI_TERMS = [
              "ai", "artificial intelligence", "generative", "genai", "machine learning", "model", "llm",
              "agent", "automation", "chatgpt", "openai", "deepmind", "anthropic", "nvidia", "copilot",
              "computer vision", "recommendation", "personalization", "forecasting", "algorithm"
          ]
          RETAIL_TERMS = TOPIC_DEFS[0][1]

          def now_utc():
              return dt.datetime.now(dt.timezone.utc)

          def local_name(tag):
              return tag.split("}", 1)[-1].lower() if "}" in tag else tag.lower()

          def strip_html(value):
              if not value:
                  return ""
              value = re.sub(r"(?is)<script.*?</script>", " ", value)
              value = re.sub(r"(?is)<style.*?</style>", " ", value)
              value = re.sub(r"(?s)<[^>]+>", " ", value)
              value = html.unescape(value)
              return re.sub(r"\s+", " ", value).strip()

          def clean_spaces(value):
              return re.sub(r"\s+", " ", value or "").strip()

          def limit_text(value, n=260):
              value = clean_spaces(value)
              if len(value) <= n:
                  return value
              cut = value[: n - 1].rsplit(" ", 1)[0]
              return cut + "..."

          def text_of_child(node, names):
              names = {n.lower() for n in names}
              for child in list(node):
                  if local_name(child.tag) in names and child.text:
                      return clean_spaces(child.text)
              return ""

          def parse_date(value):
              if not value:
                  return None
              value = clean_spaces(value)
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(dt.timezone.utc)
              except Exception:
                  pass
              try:
                  fixed = value.replace("Z", "+00:00")
                  parsed = dt.datetime.fromisoformat(fixed)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(dt.timezone.utc)
              except Exception:
                  return None

          def http_get(url, max_bytes=2000000, referer=None):
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,nl;q=0.8",
                  "Cache-Control": "no-cache",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read(max_bytes + 1)
                  if len(data) > max_bytes:
                      raise ValueError("response too large")
                  info = resp.info()
                  final_url = resp.geturl()
              return data, info, final_url

          def fetch_text(url, max_bytes=2000000):
              data, info, final_url = http_get(url, max_bytes=max_bytes)
              ctype = info.get("Content-Type", "")
              charset = "utf-8"
              m = re.search(r"charset=([A-Za-z0-9_\-]+)", ctype)
              if m:
                  charset = m.group(1)
              try:
                  text = data.decode(charset, errors="replace")
              except Exception:
                  text = data.decode("utf-8", errors="replace")
              return text, final_url

          def extract_attrs(tag):
              attrs = {}
              for m in re.finditer(r"([A-Za-z_:.-]+)\s*=\s*(['\"])(.*?)\2", tag, re.S):
                  attrs[m.group(1).lower()] = html.unescape(m.group(3).strip())
              return attrs

          def absolutize(url, base):
              if not url:
                  return ""
              url = html.unescape(url.strip())
              if url.startswith("//"):
                  return "https:" + url
              return urllib.parse.urljoin(base, url)

          def normalize_url(url):
              if not url:
                  return ""
              p = urllib.parse.urlsplit(url)
              return urllib.parse.urlunsplit((p.scheme, p.netloc.lower(), p.path.rstrip("/"), "", ""))

          def first_link(node, feed_url):
              for child in list(node):
                  if local_name(child.tag) == "link":
                      href = child.attrib.get("href")
                      if href:
                          return absolutize(href, feed_url)
                      if child.text:
                          return absolutize(child.text, feed_url)
              return ""

          def image_candidates_from_html_fragment(fragment, base_url, method):
              out = []
              if not fragment:
                  return out
              for tag in re.findall(r"(?is)<img\b[^>]*>", fragment):
                  attrs = extract_attrs(tag)
                  src = attrs.get("src") or attrs.get("data-src") or attrs.get("data-original")
                  if not src and attrs.get("srcset"):
                      src = pick_from_srcset(attrs.get("srcset"))
                  if src:
                      out.append({"url": absolutize(src, base_url), "method": method})
              return out

          def pick_from_srcset(srcset):
              if not srcset:
                  return ""
              best_url = ""
              best_score = -1
              for part in srcset.split(","):
                  bits = part.strip().split()
                  if not bits:
                      continue
                  url = bits[0]
                  score = 1
                  if len(bits) > 1:
                      m = re.search(r"(\d+)(w|x)", bits[1])
                      if m:
                          score = int(m.group(1))
                  if score > best_score:
                      best_url = url
                      best_score = score
              return best_url

          def image_candidates_from_xml(node, base_url):
              out = []
              fragments = []
              for elem in node.iter():
                  lname = local_name(elem.tag)
                  attrib_lower = {k.lower(): v for k, v in elem.attrib.items()}
                  if lname in {"content", "thumbnail"} and attrib_lower.get("url"):
                      out.append({"url": absolutize(attrib_lower["url"], base_url), "method": "rss-media"})
                  if lname == "enclosure" and attrib_lower.get("url") and "image" in attrib_lower.get("type", ""):
                      out.append({"url": absolutize(attrib_lower["url"], base_url), "method": "rss-enclosure"})
                  if lname == "image" and attrib_lower.get("href"):
                      out.append({"url": absolutize(attrib_lower["href"], base_url), "method": "rss-image"})
                  if lname in {"description", "encoded", "summary", "content"} and elem.text:
                      fragments.append(elem.text)
              for frag in fragments:
                  out.extend(image_candidates_from_html_fragment(frag, base_url, "rss-html-img"))
              return out

          def collect_page_image_candidates(article_url):
              try:
                  page, final_url = fetch_text(article_url, max_bytes=2500000)
              except Exception as exc:
                  return [], [f"article page fetch failed: {type(exc).__name__}: {exc}"]
              out = []
              reasons = []
              for tag in re.findall(r"(?is)<meta\b[^>]*>", page):
                  attrs = extract_attrs(tag)
                  key = (attrs.get("property") or attrs.get("name") or "").lower()
                  content = attrs.get("content") or ""
                  if key in {"og:image", "og:image:url", "og:image:secure_url", "twitter:image", "twitter:image:src"} and content:
                      out.append({"url": absolutize(content, final_url), "method": key})
              for tag in re.findall(r"(?is)<link\b[^>]*>", page):
                  attrs = extract_attrs(tag)
                  rel = (attrs.get("rel") or "").lower()
                  href = attrs.get("href") or ""
                  if href and rel in {"image_src", "preload"} and ("image" in attrs.get("as", "").lower() or rel == "image_src"):
                      out.append({"url": absolutize(href, final_url), "method": "link-image"})
              for script in re.findall(r"(?is)<script[^>]+application/ld\+json[^>]*>(.*?)</script>", page):
                  script = html.unescape(script.strip())
                  try:
                      data = json.loads(script)
                  except Exception:
                      continue
                  def walk(obj):
                      if isinstance(obj, dict):
                          image = obj.get("image") or obj.get("thumbnailUrl")
                          if isinstance(image, str):
                              out.append({"url": absolutize(image, final_url), "method": "json-ld-image"})
                          elif isinstance(image, dict) and image.get("url"):
                              out.append({"url": absolutize(image.get("url"), final_url), "method": "json-ld-image"})
                          elif isinstance(image, list):
                              for item in image[:3]:
                                  if isinstance(item, str):
                                      out.append({"url": absolutize(item, final_url), "method": "json-ld-image"})
                                  elif isinstance(item, dict) and item.get("url"):
                                      out.append({"url": absolutize(item.get("url"), final_url), "method": "json-ld-image"})
                          for value in obj.values():
                              walk(value)
                      elif isinstance(obj, list):
                          for item in obj[:6]:
                              walk(item)
                  walk(data)
              for tag in re.findall(r"(?is)<img\b[^>]*>", page):
                  attrs = extract_attrs(tag)
                  altclass = " ".join([attrs.get("alt", ""), attrs.get("class", ""), attrs.get("id", "")]).lower()
                  if any(bad in altclass for bad in ["logo", "icon", "avatar", "author", "profile", "tracking", "pixel"]):
                      continue
                  src = attrs.get("src") or attrs.get("data-src") or attrs.get("data-original")
                  if not src and attrs.get("srcset"):
                      src = pick_from_srcset(attrs.get("srcset"))
                  if src and not src.startswith("data:"):
                      out.append({"url": absolutize(src, final_url), "method": "page-img"})
                  if len(out) > 20:
                      break
              return out, reasons

          def sniff_mime(data, content_type, url):
              ctype = (content_type or "").split(";", 1)[0].strip().lower()
              if ctype.startswith("image/"):
                  return ctype
              if data.startswith(b"\xff\xd8\xff"):
                  return "image/jpeg"
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return "image/png"
              if data.startswith(b"GIF87a") or data.startswith(b"GIF89a"):
                  return "image/gif"
              if data[:12].endswith(b"WEBP") or b"WEBP" in data[:16]:
                  return "image/webp"
              lower = urllib.parse.urlsplit(url).path.lower()
              if lower.endswith(".jpg") or lower.endswith(".jpeg"):
                  return "image/jpeg"
              if lower.endswith(".png"):
                  return "image/png"
              if lower.endswith(".webp"):
                  return "image/webp"
              if lower.endswith(".gif"):
                  return "image/gif"
              if lower.endswith(".avif"):
                  return "image/avif"
              return ""

          def looks_bad_image_url(url):
              lower = url.lower()
              bad = ["logo", "favicon", "icon", "avatar", "author", "profile", "tracking", "pixel", "sprite"]
              return any(token in lower for token in bad)

          def embedded_image_from_candidates(candidates, article_url):
              seen = set()
              failures = []
              for cand in candidates[:28]:
                  url = absolutize(cand.get("url", ""), article_url)
                  if not url or url in seen or url.startswith("data:"):
                      continue
                  seen.add(url)
                  if looks_bad_image_url(url):
                      failures.append({"url": url, "reason": "skipped probable logo/icon/avatar"})
                      continue
                  try:
                      data, info, final_url = http_get(url, max_bytes=MAX_IMAGE_BYTES, referer=article_url)
                      if len(data) < MIN_IMAGE_BYTES:
                          failures.append({"url": url, "reason": f"too small: {len(data)} bytes"})
                          continue
                      mime = sniff_mime(data, info.get("Content-Type", ""), final_url)
                      if not mime.startswith("image/"):
                          failures.append({"url": url, "reason": "not an image"})
                          continue
                      if mime == "image/svg+xml":
                          failures.append({"url": url, "reason": "svg skipped"})
                          continue
                      b64 = base64.b64encode(data).decode("ascii")
                      return {
                          "ok": True,
                          "data_uri": f"data:{mime};base64,{b64}",
                          "mime": mime,
                          "source_image_url": final_url,
                          "method": cand.get("method", "unknown"),
                          "bytes": len(data),
                          "attempted": len(seen),
                          "failures_before_success": failures[:8],
                      }
                  except Exception as exc:
                      failures.append({"url": url, "reason": f"{type(exc).__name__}: {exc}"})
              return {"ok": False, "failures": failures[:16], "attempted": len(seen)}

          def parse_feed(feed):
              status = {"source": feed["source"], "ok": False, "items": 0, "error": ""}
              try:
                  xml_text, final_url = fetch_text(feed["url"], max_bytes=2500000)
                  root = ET.fromstring(xml_text.encode("utf-8"))
              except Exception as exc:
                  status["error"] = f"{type(exc).__name__}: {exc}"
                  return [], status
              nodes = []
              for node in root.iter():
                  if local_name(node.tag) in {"item", "entry"}:
                      nodes.append(node)
              items = []
              for node in nodes[:MAX_ITEMS_PER_SOURCE]:
                  title = text_of_child(node, ["title"])
                  link = first_link(node, final_url)
                  summary = text_of_child(node, ["description", "summary", "encoded", "content"])
                  date_text = text_of_child(node, ["pubDate", "published", "updated", "date"])
                  published = parse_date(date_text)
                  candidates = image_candidates_from_xml(node, final_url)
                  if title and link:
                      items.append({
                          "title": strip_html(title),
                          "url": link,
                          "summary_raw": summary,
                          "summary": limit_text(strip_html(summary), 280),
                          "published": published,
                          "source": feed["source"],
                          "source_kind": feed["kind"],
                          "rss_image_candidates": candidates,
                      })
              status["ok"] = True
              status["items"] = len(items)
              return items, status

          def classify_topics(text, source_kind):
              low = text.lower()
              topics = []
              for topic, kws in TOPIC_DEFS:
                  if any(kw in low for kw in kws):
                      topics.append(topic)
              if source_kind == "retail" and "Retail & Consumer Services" not in topics:
                  topics.insert(0, "Retail & Consumer Services")
              if not topics:
                  topics.append("Research & Market Signals")
              return topics

          def is_relevant(item, topics):
              text = f"{item['title']} {item['summary']} {item['source']}".lower()
              ai_hit = any(term in text for term in AI_TERMS)
              retail_hit = any(term in text for term in RETAIL_TERMS) or item["source_kind"] == "retail"
              if item["source_kind"] == "ai":
                  return True
              return ai_hit or (retail_hit and any(t in topics for t in ["Data, Platforms & Cloud", "Customer & Loyalty", "Store Operations", "Pricing & Merchandising"]))

          def cgi_angle(item, topics):
              if "Retail & Consumer Services" in topics:
                  if "Customer & Loyalty" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan personalisatie, klantdata en loyalty. Bruikbaar in klantgesprekken over omnichannel klantbeleving en verantwoord opschalen van AI." 
                  if "Store Operations" in topics or "Supply Chain & Forecasting" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan operationele AI-toepassingen: forecasting, voorraad, winkelprocessen en service. Goed startpunt voor gesprekken over data readiness en procesintegratie."
                  if "Pricing & Merchandising" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat pricing, promoties, assortiment en retail media direct invloed hebben op marge, klantwaarde en commerciële besluitvorming."
                  return "Relevant voor CGI Retail & Consumer Services omdat het een signaal geeft over hoe retailers en consumer-services organisaties AI inzetten in klantprocessen, platformkeuzes en digitale operatie."
              if "Governance, Risk & Responsible AI" in topics:
                  return "Goed om te volgen voor CGI omdat governance, security en responsible AI bepalend zijn voor betrouwbare AI-adoptie bij klanten en voor schaalbare delivery."
              if "AI Agents & Automation" in topics:
                  return "Interessant voor CGI omdat agents en automatisering impact hebben op procesontwerp, integratie, service-operatie en toekomstige AI-proposities richting klanten."
              if "Data, Platforms & Cloud" in topics:
                  return "Relevant voor CGI omdat platform-, cloud- en datakeuzes bepalen hoe snel klanten AI veilig en betaalbaar kunnen opschalen."
              return "Goed om te weten voor CGI omdat deze AI-ontwikkeling invloed kan hebben op klantverwachtingen, vendor-roadmaps en toekomstige advies- en deliverygesprekken."

          def format_date(value):
              if not value:
                  return "Datum onbekend"
              ams = value.astimezone(dt.timezone(dt.timedelta(hours=2)))
              return ams.strftime("%d-%m-%Y")

          def article_sort_key(item):
              return item.get("published") or dt.datetime(1970, 1, 1, tzinfo=dt.timezone.utc)

          def html_escape(value):
              return html.escape(value or "", quote=True)

          def build_articles():
              all_items = []
              statuses = []
              cutoff = now_utc() - dt.timedelta(hours=LOOKBACK_HOURS)
              print("WORKFLOW_VERSION:", VERSION)
              for feed in FEEDS:
                  print(f"FEED: {feed['source']} | {feed['url']}")
                  items, status = parse_feed(feed)
                  statuses.append(status)
                  for item in items:
                      if item.get("published") and item["published"] < cutoff:
                          continue
                      topics = classify_topics(f"{item['title']} {item['summary']} {item['source']}", item["source_kind"])
                      if not is_relevant(item, topics):
                          continue
                      item["topics"] = topics
                      item["cgi_angle"] = cgi_angle(item, topics)
                      all_items.append(item)
              dedup = {}
              for item in all_items:
                  key = normalize_url(item["url"]) or item["title"].lower()
                  if key not in dedup or article_sort_key(item) > article_sort_key(dedup[key]):
                      dedup[key] = item
              candidates = sorted(dedup.values(), key=article_sort_key, reverse=True)
              published = []
              rejected = []
              for item in candidates:
                  page_candidates, page_reasons = collect_page_image_candidates(item["url"])
                  image_candidates = item.get("rss_image_candidates", []) + page_candidates
                  image_selection = embedded_image_from_candidates(image_candidates, item["url"])
                  if image_selection.get("ok"):
                      item["image"] = image_selection
                      published.append(item)
                      print(f"IMAGE_OK: {item['source']} | {item['title'][:70]} | {image_selection.get('method')} | {image_selection.get('mime')} | {image_selection.get('bytes')} bytes")
                  else:
                      rejected.append({
                          "source": item["source"],
                          "title": item["title"],
                          "url": item["url"],
                          "reason": "no downloadable source image",
                          "page_reasons": page_reasons[:3],
                          "image_failures": image_selection.get("failures", [])[:6],
                      })
                      print(f"IMAGE_REJECT: {item['source']} | {item['title'][:70]}")
                  if len(published) >= MAX_ARTICLES:
                      break
              return published, rejected, statuses

          def build_html(articles, rejected, statuses):
              generated = now_utc()
              retail_count = sum(1 for a in articles if "Retail & Consumer Services" in a["topics"])
              topic_counts = {topic: 0 for topic, _ in TOPIC_DEFS}
              for a in articles:
                  for t in a["topics"]:
                      topic_counts[t] = topic_counts.get(t, 0) + 1
              cards = []
              for idx, a in enumerate(articles, 1):
                  topics_str = "|".join(a["topics"])
                  tags = "".join(f'<button class="tag" data-filter="{html_escape(t)}">{html_escape(t)}</button>' for t in a["topics"][:4])
                  summary = a["summary"] or "Korte samenvatting niet beschikbaar in de feed; open de bron voor details."
                  cards.append(f'''
                    <article class="card" data-topics="{html_escape(topics_str)}">
                      <div class="visual">
                        <img src="{a['image']['data_uri']}" alt="Bronafbeelding bij {html_escape(a['title'])}" loading="lazy">
                        <span class="image-label">Bronbeeld - {html_escape(a['image'].get('method', 'source'))}</span>
                      </div>
                      <div class="card-body">
                        <div class="meta"><span>{html_escape(a['source'])}</span><span>{html_escape(format_date(a.get('published')))}</span></div>
                        <h3>{html_escape(a['title'])}</h3>
                        <p class="summary">{html_escape(summary)}</p>
                        <div class="cgi"><strong>CGI Angle:</strong> {html_escape(a['cgi_angle'])}</div>
                        <div class="tags">{tags}</div>
                        <a class="source-button" href="{html_escape(a['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel -></a>
                      </div>
                    </article>
                  ''')
              filters = ['Alle artikelen'] + [topic for topic, _ in TOPIC_DEFS if topic_counts.get(topic, 0) > 0]
              filter_buttons = "".join(f'<button class="filter {'active' if i == 0 else ''}" data-filter="{html_escape(f)}">{html_escape(f)}<span>{len(articles) if f == "Alle artikelen" else topic_counts.get(f,0)}</span></button>' for i, f in enumerate(filters))
              week_summary = build_week_summary(articles, retail_count)
              html_doc = f'''<!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="Cache-Control" content="no-store">
            <title>CGI AI & Retail Weekstream</title>
            <style>
              :root {{ --cgi-red:#e31937; --cgi-purple:#5236ab; --black:#000; --white:#fff; --soft:#f6f4f8; --line:#e8e4ee; --text:#161316; --muted:#665f6d; }}
              * {{ box-sizing:border-box; }}
              body {{ margin:0; font-family: Inter, Arial, Helvetica, sans-serif; background:var(--soft); color:var(--text); }}
              .login {{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--cgi-red), #a82465, var(--cgi-purple)); z-index:20; padding:24px; }}
              .login-card {{ width:min(440px, 100%); background:#fff; border-radius:28px; padding:32px; box-shadow:0 28px 70px rgba(0,0,0,.28); }}
              .login-card h1 {{ margin:0 0 8px; font-size:28px; }}
              .login-card p {{ color:var(--muted); line-height:1.5; }}
              .login-card input {{ width:100%; padding:15px 16px; border-radius:14px; border:1px solid var(--line); font-size:17px; margin:12px 0; }}
              .login-card button {{ width:100%; background:var(--cgi-red); color:white; border:0; padding:15px 18px; border-radius:14px; font-weight:800; cursor:pointer; }}
              .login-error {{ color:var(--cgi-red); min-height:22px; font-weight:700; }}
              .app {{ display:none; }}
              header {{ background:linear-gradient(135deg, var(--cgi-red), #a82465, var(--cgi-purple)); color:#fff; padding:42px clamp(20px,4vw,56px); }}
              .topbar {{ display:flex; justify-content:space-between; gap:20px; align-items:center; flex-wrap:wrap; }}
              .brand {{ font-size:26px; font-weight:900; letter-spacing:.02em; }}
              .badge {{ border:1px solid rgba(255,255,255,.5); border-radius:999px; padding:7px 12px; font-size:12px; opacity:.95; }}
              h1 {{ margin:28px 0 12px; font-size:clamp(34px,6vw,72px); line-height:.95; max-width:1000px; }}
              .subtitle {{ font-size:clamp(17px,2vw,22px); max-width:940px; line-height:1.45; opacity:.94; }}
              .hero-stat {{ margin-top:24px; display:inline-flex; gap:10px; align-items:center; background:#fff; color:#000; border-radius:999px; padding:11px 18px; font-weight:900; }}
              main {{ width:min(1220px, calc(100% - 32px)); margin:0 auto; }}
              .panel {{ background:#fff; border:1px solid var(--line); border-radius:26px; padding:clamp(20px,3vw,34px); margin:26px 0; box-shadow:0 12px 30px rgba(30,20,50,.06); }}
              h2 {{ margin:0 0 14px; font-size:clamp(24px,3vw,34px); }}
              .week-summary {{ font-size:18px; line-height:1.7; color:#29242f; }}
              .filters {{ display:flex; flex-wrap:wrap; gap:10px; }}
              .filter, .tag {{ border:1px solid var(--line); background:#fff; color:#251f2c; border-radius:999px; padding:9px 12px; cursor:pointer; font-weight:700; }}
              .filter span {{ margin-left:7px; opacity:.6; }}
              .filter.active, .tag:hover {{ background:var(--cgi-purple); color:#fff; border-color:var(--cgi-purple); }}
              .grid {{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:22px; margin:26px 0 50px; }}
              .card {{ background:#fff; border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 18px 38px rgba(32,23,46,.08); display:flex; flex-direction:column; min-height:100%; }}
              .visual {{ position:relative; aspect-ratio:16/9; background:#ddd; overflow:hidden; }}
              .visual img {{ width:100%; height:100%; object-fit:cover; display:block; }}
              .image-label {{ position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,.72); color:#fff; font-size:11px; border-radius:999px; padding:6px 9px; }}
              .card-body {{ padding:20px; display:flex; flex-direction:column; gap:12px; flex:1; }}
              .meta {{ display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:13px; font-weight:800; }}
              .card h3 {{ margin:0; font-size:21px; line-height:1.22; }}
              .summary {{ margin:0; color:#3e3945; line-height:1.55; }}
              .cgi {{ background:#fbf7f8; border-left:4px solid var(--cgi-red); padding:13px 14px; border-radius:13px; line-height:1.45; }}
              .tags {{ display:flex; flex-wrap:wrap; gap:8px; }}
              .tag {{ font-size:12px; padding:7px 10px; }}
              .source-button {{ margin-top:auto; display:inline-flex; justify-content:center; align-items:center; text-decoration:none; background:var(--cgi-red); color:#fff; border-radius:14px; padding:13px 16px; font-weight:900; }}
              .source-button:hover {{ filter:brightness(.94); }}
              .hidden {{ display:none !important; }}
              footer {{ color:var(--muted); padding:30px 0 50px; font-size:13px; }}
              @media (max-width:980px) {{ .grid {{ grid-template-columns:repeat(2, minmax(0,1fr)); }} }}
              @media (max-width:650px) {{ .grid {{ grid-template-columns:1fr; }} header {{ padding:30px 18px; }} .panel {{ border-radius:20px; }} }}
            </style>
          </head>
          <body>
            <section id="login" class="login">
              <div class="login-card">
                <div class="brand" style="color:var(--cgi-red)">CGI</div>
                <h1>AI & Retail Weekstream</h1>
                <p>Voer de toegangscode in om de briefing te openen.</p>
                <input id="code" type="password" placeholder="Toegangscode" autocomplete="off">
                <button id="loginBtn">Open briefing</button>
                <div id="loginError" class="login-error"></div>
                <p style="font-size:12px">Let op: dit is een lichte toegangsdrempel voor een statische GitHub Pages-site, geen enterprise-login.</p>
              </div>
            </section>
            <div id="app" class="app">
              <header>
                <div class="topbar"><div class="brand">CGI</div><div class="badge">{VERSION}</div></div>
                <h1>AI & Retail Weekstream</h1>
                <p class="subtitle">Wekelijkse selectie van internationale AI-ontwikkelingen met specifieke relevantie voor Retail & Consumer Services.</p>
                <div class="hero-stat">{len(articles)} relevante artikelen</div>
              </header>
              <main>
                <section class="panel">
                  <h2>Weeksamenvatting</h2>
                  <div class="week-summary">{week_summary}</div>
                </section>
                <section class="panel">
                  <h2>Filter op topic</h2>
                  <div class="filters">{filter_buttons}</div>
                </section>
                <section class="grid" id="cards">{''.join(cards)}</section>
                <section class="panel">
                  <h2>Retail & Consumer Services: relevante artikelen</h2>
                  <p>Gebruik de filter <strong>Retail & Consumer Services</strong> om direct de artikelen te tonen die het meest relevant zijn voor retailklanten, consumer-services-klanten, omnichannel operatie, klantdata, commerce en AI-adoptie.</p>
                </section>
                <footer>
                  Gegenereerd op {generated.strftime('%d-%m-%Y %H:%M UTC')}. Alle zichtbare artikelbeelden zijn embedded bronafbeeldingen uit RSS, Open Graph, Twitter image metadata, JSON-LD of het originele artikel. Fallback visuals: 0.
                </footer>
              </main>
            </div>
            <script>
              const ACCESS_CODE = {json.dumps(ACCESS_CODE)};
              const login = document.getElementById('login');
              const app = document.getElementById('app');
              function showApp() {{ login.style.display='none'; app.style.display='block'; }}
              if (localStorage.getItem('cgi_weekstream_access') === ACCESS_CODE) showApp();
              document.getElementById('loginBtn').addEventListener('click', () => {{
                const value = document.getElementById('code').value;
                if (value === ACCESS_CODE) {{ localStorage.setItem('cgi_weekstream_access', value); showApp(); }}
                else {{ document.getElementById('loginError').textContent = 'Onjuiste toegangscode.'; }}
              }});
              document.getElementById('code').addEventListener('keydown', (e) => {{ if (e.key === 'Enter') document.getElementById('loginBtn').click(); }});
              function applyFilter(topic) {{
                document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === topic));
                document.querySelectorAll('.card').forEach(card => {{
                  const match = topic === 'Alle artikelen' || card.dataset.topics.split('|').includes(topic);
                  card.classList.toggle('hidden', !match);
                }});
              }}
              document.querySelectorAll('.filter, .tag').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter)));
            </script>
          </body>
          </html>'''
              status = {
                  "version": VERSION,
                  "generated_at_utc": generated.isoformat(),
                  "lookback_hours": LOOKBACK_HOURS,
                  "article_count": len(articles),
                  "retail_article_count": retail_count,
                  "strict_source_images": True,
                  "source_images_embedded": len(articles),
                  "fallback_visuals": 0,
                  "no_external_image_paths": True,
                  "image_pipeline": "rss_or_article_metadata_source_image_downloaded_and_embedded_as_data_uri",
                  "topics": topic_counts,
                  "sources": statuses,
                  "published_images_sample": [
                      {"source": a["source"], "title": a["title"], "article_url": a["url"], "image_method": a["image"].get("method"), "source_image_url": a["image"].get("source_image_url"), "mime": a["image"].get("mime"), "bytes": a["image"].get("bytes")}
                      for a in articles[:12]
                  ],
                  "rejected_without_source_image_count": len(rejected),
                  "rejected_without_source_image_sample": rejected[:12],
              }
              return html_doc, status

          def build_week_summary(articles, retail_count):
              if not articles:
                  return "Er zijn binnen de ingestelde bronnen geen relevante artikelen met bruikbare bronafbeelding gevonden. Controleer status.json voor de reden."
              top_sources = {}
              for a in articles:
                  top_sources[a["source"]] = top_sources.get(a["source"], 0) + 1
              source_names = ", ".join(list(top_sources.keys())[:5])
              return (
                  f"Afgelopen week zijn {len(articles)} relevante AI-artikelen opgenomen, waarvan {retail_count} met een duidelijke link naar Retail & Consumer Services. "
                  f"De selectie bevat signalen uit onder meer {html_escape(source_names)}. De nadruk ligt op AI-adoptie, agents, foundation models, data- en platformontwikkelingen, governance en toepassingen voor retail- en consumer-services organisaties."
              )

          def write_site(html_doc, status):
              os.makedirs("site/latest", exist_ok=True)
              for path in ["site/index.html", "site/latest/index.html"]:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(html_doc)
              for path in ["site/status.json", "site/latest/status.json"]:
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(status, f, ensure_ascii=False, indent=2)
              with open("site/DEPLOYMENT_CHECK.txt", "w", encoding="utf-8") as f:
                  f.write(f"{VERSION}\nRoot and /latest were generated by the same workflow.\n")
              with open("site/.nojekyll", "w", encoding="utf-8") as f:
                  f.write("")

          articles, rejected, statuses = build_articles()
          html_doc, status = build_html(articles, rejected, statuses)
          write_site(html_doc, status)
          print(json.dumps({"version": VERSION, "article_count": len(articles), "source_images_embedded": len(articles), "fallback_visuals": 0, "rejected": len(rejected)}, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
