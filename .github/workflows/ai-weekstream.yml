              .gate-logo{font-weight:900;font-size:30px;letter-spacing:-.04em}.gate h1{font-size:34px;line-height:1.05;margin:18px 0 10px}.gate p{opacity:.92;line-height:1.5}.gate input{width:100%;border:0;border-radius:16px;padding:16px 18px;margin:12px 0;font-size:18px}.gate button{border:0;border-radius:999px;background:#fff;color:#111;padding:14px 20px;font-weight:800;cursor:pointer}.gate .error{display:none;color:#ffdfe4;font-weight:700}.hidden{display:none!important}
              .hero{background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple));color:#fff;padding:42px 20px 54px}.hero-inner{max-width:1180px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:34px;font-weight:950;letter-spacing:-.05em}.version{font-size:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;opacity:.9}.hero h1{font-size:clamp(36px,7vw,76px);letter-spacing:-.06em;line-height:.92;margin:45px 0 18px;max-width:920px}.hero p{font-size:clamp(16px,2vw,21px);line-height:1.5;max-width:920px;opacity:.94}.stat{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:999px;padding:13px 18px;font-weight:900;margin-top:22px}.content{max-width:1180px;margin:-32px auto 80px;padding:0 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px;margin-bottom:24px}.panel h2{font-size:28px;letter-spacing:-.03em;margin:0 0 12px}.panel p{color:#303240;line-height:1.65}.source-note{font-size:13px;color:var(--muted);margin-top:14px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.filter,.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:750;cursor:pointer;color:#222}.filter.active,.tag:hover{background:var(--cgi-purple);color:#fff;border-color:var(--cgi-purple)}.top-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.top-card{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.05)}.top-card img{width:160px;height:100%;min-height:170px;object-fit:cover}.top-card-body{padding:18px}.top-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:850;text-transform:uppercase}.top-card h3{font-size:18px;line-height:1.15;margin:10px 0 8px;letter-spacing:-.02em}.top-card p{font-size:14px;line-height:1.45;margin:0 0 12px;color:#303240}.top-card a{display:inline-flex;text-decoration:none;background:var(--cgi-purple);color:#fff;border-radius:999px;padding:10px 13px;font-size:13px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.06);display:flex;flex-direction:column}.image-wrap{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.image-wrap img{width:100%;height:100%;display:block;object-fit:cover}.image-label{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:7px 10px}.card-body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.meta span{background:var(--soft);border-radius:999px;padding:6px 9px}.card h3{font-size:21px;line-height:1.12;letter-spacing:-.03em;margin:0}.summary{margin:0;color:#3d4050;line-height:1.5}.angle{margin:0;background:#fbf4f6;border-left:4px solid var(--cgi-red);padding:13px 14px;border-radius:14px;color:#222;line-height:1.45;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{font-size:12px;padding:7px 10px}.source-button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--cgi-red);color:#fff;border-radius:999px;padding:13px 16px;font-weight:900;margin-top:auto;transition:transform .15s ease,box-shadow .15s ease}.source-button:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(227,25,55,.25)}.retail-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}.retail-list li{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.retail-list a{font-weight:850;text-decoration:none}.retail-list span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.empty{padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#fff}.footer{max-width:1180px;margin:0 auto 40px;padding:0 20px;color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:980px){.grid,.top-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{max-width:760px}}@media(max-width:640px){.grid,.top-grid{grid-template-columns:1fr}.top-card{grid-template-columns:1fr}.top-card img{width:100%;height:180px}.content{padding:0 14px}.panel{padding:20px;border-radius:22px}.hero{padding:30px 14px 44px}.brand{align-items:flex-start;flex-direction:column}.hero h1{font-size:42px}.gate-box{padding:24px;border-radius:22px}}
              '''
              js = f'''
              const ACCESS_HASH = "{login_code_hash}";
              async function sha256(text) {{
                const data = new TextEncoder().encode(text);
                const hash = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
              }}
              async function unlock() {{
                const value = document.getElementById('accessCode').value || '';
                const digest = await sha256(value);
                if (digest === ACCESS_HASH) {{
                  sessionStorage.setItem('cgi_ai_weekstream_access','ok');
                  document.getElementById('gate').classList.add('hidden');
                  document.getElementById('app').classList.remove('hidden');
                }} else {{ document.getElementById('loginError').style.display = 'block'; }}
              }}
              function applyFilter(topic) {{
                document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === topic));
                document.querySelectorAll('.card').forEach(card => {{
                  const topics = card.dataset.topics || '';
                  const tags = card.dataset.tags || '';
                  card.style.display = (topic === 'all' || topics.includes(topic) || tags.includes(topic)) ? '' : 'none';
                }});
              }}
              document.addEventListener('DOMContentLoaded', () => {{
                if (sessionStorage.getItem('cgi_ai_weekstream_access') === 'ok') {{
                  document.getElementById('gate').classList.add('hidden');
                  document.getElementById('app').classList.remove('hidden');
                }}
                document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => applyFilter(el.dataset.filter)));
                document.getElementById('accessCode')?.addEventListener('keydown', e => {{ if (e.key === 'Enter') unlock(); }});
              }});
              '''
              count = len(articles)
              if count == 0:
                  article_html = '<div class="empty">Geen artikelen gepubliceerd binnen de CGI RCS-relevantieregels. Controleer status.json voor bron- en scoringsdiagnose.</div>'
              return f'''<!doctype html>
              <html lang="nl">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <meta name="robots" content="noindex,nofollow">
                <title>CGI AI & IT Retail & Consumer Services Weekstream</title>
                <style>{css}</style>
              </head>
              <body>
                <section id="gate" class="gate">
                  <div class="gate-box">
                    <div class="gate-logo">CGI</div>
                    <h1>AI & IT Retail & Consumer Services Weekstream</h1>
                    <p>Voer de toegangscode in om de wekelijkse briefing te openen.</p>
                    <input id="accessCode" type="password" placeholder="Toegangscode" autocomplete="current-password">
                    <button onclick="unlock()">Open briefing</button>
                    <p id="loginError" class="error">Onjuiste code. Controleer hoofdletters en leestekens.</p>
                  </div>
                </section>
                <main id="app" class="hidden">
                  <header class="hero">
                    <div class="hero-inner">
                      <div class="brand"><div class="logo">CGI</div><div class="version">{VERSION}</div></div>
                      <h1>AI & IT Weekstream voor Retail & Consumer Services</h1>
                      <p>AI- en IT-focussed news met praktische relevantie voor CGI Retail & Consumer Services: retail, commerce, customer experience, operations, data, platformen en consumer services.</p>
                      <div class="stat">{count} relevante artikelen</div>
                    </div>
                  </header>
                  <section class="content">
                    <section class="panel">
                      <h2>Weeksamenvatting</h2>
                      <p>{html_escape(week_summary)}</p>
                      <div class="source-note">Scope: AI- en IT-ontwikkelingen met relevantie voor CGI Retail & Consumer Services, inclusief retailtech, commerce-platformen en Nederlandse/EU-marktsignalen. Bronbeelden hebben prioriteit; als een bronbeeld niet downloadbaar is, gebruikt de pagina een CGI-branded visual zodat relevante artikelen niet wegvallen.</div>
                    </section>
                    <section class="panel">
                      <h2>Topselectie voor CGI Retail & Consumer Services</h2>
                      <p>De belangrijkste signalen voor klantgesprekken, proposities en delivery deze week.</p>
                      <div class="top-grid">{top_html}</div>
                    </section>
                    <section class="panel">
                      <h2>Filter op topic</h2>
                      <div class="filters">{''.join(filters_html)}</div>
                    </section>
                    <section class="grid" id="articleGrid">{article_html}</section>
                    <section class="panel" style="margin-top:24px">
                      <h2>Retail & Consumer Services: relevante artikelen</h2>
                      <ul class="retail-list">{retail_html}</ul>
                    </section>
                  </section>
                  <footer class="footer">
                    Gegenereerd op {html_escape(generated_local)}. Bronnen met gepubliceerde artikelen: {html_escape(source_summary)}. De login-code is een lichte statische toegangsdrempel, geen enterprise-authenticatie.
                  </footer>
                </main>
                <script>{js}</script>
              </body></html>'''

          def main():
              log(f"WORKFLOW_VERSION: {VERSION}")
              cutoff = now_utc() - timedelta(hours=LOOKBACK_HOURS)
              source_status = []
              raw_items = []
              for source in SOURCES:
                  log(f"SOURCE: {source['name']} | {source['kind']}")
                  ok = False
                  items_for_source = []
                  errors = []
                  for feed in source["feeds"]:
                      log(f"  FEED: {feed}")
                      try:
                          xml_text, ctype = request_text(feed, max_bytes=MAX_HTML_BYTES)
                          items = parse_feed(xml_text, source)
                          items_for_source.extend(items)
                          ok = True
                          if items:
                              break
                      except Exception as e:
                          errors.append(f"{feed}: {e}")
                  recent = [x for x in items_for_source if x.get("published") and x["published"] >= cutoff]
                  raw_items.extend(recent)
                  source_status.append({
                      "source": source["name"],
                      "kind": source["kind"],
                      "ok": ok,
                      "items_total": len(items_for_source),
                      "items_recent": len(recent),
                      "error": " | ".join(errors[:2]),
                  })

              dedup = {}
              for item in raw_items:
                  key = clean_url(item["url"])
                  if not key:
                      continue
                  if key not in dedup or item.get("published", now_utc()) > dedup[key].get("published", now_utc()):
                      dedup[key] = item
              candidates = [classify_and_score(x) for x in dedup.values()]
              scored = [x for x in candidates if x.get("eligible")]
              scored.sort(key=lambda x: (x.get("score", 0), x.get("published", now_utc())), reverse=True)

              published = []
              rejected_no_image = []
              rejected_date_filter = []
              for item in scored:
                  if len(published) >= MAX_PUBLISHED_ARTICLES:
                      break
                  candidates_img = list(item.get("rss_image_candidates", []))
                  page_candidates, page_date, page_date_source, page_error = fetch_article_metadata(item["url"])
                  effective_date, date_source = choose_effective_published_date(item, page_date, page_date_source)
                  if effective_date is None:
                      rejected_date_filter.append({
                          "title": item["title"],
                          "source": item["source"],
                          "url": item["url"],
                          "rss_published": item.get("published").isoformat() if item.get("published") else None,
                          "rss_published_source": item.get("published_source", ""),
                          "page_date": page_date.isoformat() if page_date else None,
                          "page_date_source": page_date_source,
                          "reason": date_source,
                      })
                      continue
                  item["published"] = effective_date
                  item["published_source_effective"] = date_source
                  item["page_published"] = page_date
                  item["page_published_source"] = page_date_source
                  candidates_img.extend(page_candidates)
                  # De-duplicate candidates.
                  seen = set()
                  unique = []
                  for c in candidates_img:
                      u = clean_url(c.get("url"))
                      if u and u not in seen:
                          seen.add(u)
                          unique.append({"url": u, "origin": c.get("origin", "source")})
                  image = source_image_to_data_uri(unique, item["url"])
                  if not image.get("ok"):
                      rejected_no_image.append({
                          "title": item["title"],
                          "source": item["source"],
                          "url": item["url"],
                          "score": item["score"],
                          "image_candidate_count": len(unique),
                          "article_page_error": page_error,
                          "image_reasons": image.get("reasons", [])[:8],
                      })
                      image = fallback_visual_to_data_uri(item)
                  item["image_data_uri"] = image["data_uri"]
                  item["source_image_url"] = image.get("source_image_url", "")
                  item["source_image_origin"] = image.get("source_image_origin", "source")
                  item["image_is_fallback"] = bool(image.get("is_fallback_visual"))
                  item["short_summary"] = summarize(item.get("summary", ""))
                  item["cgi_angle"] = cgi_angle(item)
                  published.append(item)

              topic_counts = {}
              for a in published:
                  for t in a.get("topics", []):
                      topic_counts[t] = topic_counts.get(t, 0) + 1

              generated = now_utc()
              iso_year, iso_week, _ = generated.isocalendar()
              archive_dir = OUTPUT_DIR / "archive" / f"{iso_year}-W{iso_week:02d}"
              latest_dir = OUTPUT_DIR / "latest"
              OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
              latest_dir.mkdir(parents=True, exist_ok=True)
              archive_dir.mkdir(parents=True, exist_ok=True)

              status = {
                  "version": VERSION,
                  "generated_at_utc": generated.isoformat(),
                  "lookback_hours": LOOKBACK_HOURS,
                  "strict_date_filter": True,
                  "cutoff_utc": (generated - timedelta(hours=LOOKBACK_HOURS)).isoformat(),
                  "max_future_skew_hours": MAX_FUTURE_SKEW_HOURS,
                  "scope": "AI- en IT-focussed news relevant voor CGI IT/AI toepassingen binnen Retail & Consumer Services, inclusief Nederlandse/EU retail-, commerce- en consumer-services-signalen",
                  "selection_rule": "Publish if CGI RCS relevance score passes threshold and source has AI/IT/RCS relevance. Real source images are embedded when possible; CGI fallback visuals are used only when source images cannot be downloaded.",
                  "min_relevance_score": MIN_RELEVANCE_SCORE,
                  "article_count": len(published),
                  "article_candidates_after_score": len(scored),
                  "raw_recent_items": len(raw_items),
                  "source_images_embedded": sum(1 for a in published if not a.get("image_is_fallback")),
                  "fallback_visuals": sum(1 for a in published if a.get("image_is_fallback")),
                  "strict_source_images": False,
                  "source_image_first": True,
                  "no_external_image_paths": True,
                  "image_pipeline": "source image first: RSS/article source image -> download -> crop to 16:9 -> JPG -> embed as data URI; CGI fallback visual only if source image fails",
                  "source_image_failures_with_fallback": len(rejected_no_image),
                  "source_image_failure_sample": rejected_no_image[:15],
                  "date_rejected_count": len(rejected_date_filter),
                  "date_rejected_sample": rejected_date_filter[:20],
                  "topics": topic_counts,
                  "sources": source_status,
                  "published_articles": [
                      {
                          "title": a["title"],
                          "source": a["source"],
                          "url": a["url"],
                          "published": a["published"].isoformat(),
                          "published_source_effective": a.get("published_source_effective", a.get("published_source", "")),
                          "rss_published_source": a.get("published_source", ""),
                          "page_published": a.get("page_published").isoformat() if a.get("page_published") else None,
                          "page_published_source": a.get("page_published_source", ""),
                          "score": a["score"],
                          "topics": a.get("topics", []),
                          "source_image_url": a.get("source_image_url"),
                          "source_image_origin": a.get("source_image_origin"),
                          "image_is_fallback": bool(a.get("image_is_fallback")),
                          "cgi_angle": a.get("cgi_angle"),
                      }
                      for a in published
                  ],
              }
              html_doc = render_html(published, status)
              for target in [OUTPUT_DIR, latest_dir, archive_dir]:
                  (target / "index.html").write_text(html_doc, encoding="utf-8")
                  (target / "status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
                  (target / "DEPLOYMENT_CHECK.txt").write_text(
                      f"{VERSION}\nGenerated: {generated.isoformat()}\nArticles: {len(published)}\nSource images embedded: {sum(1 for a in published if not a.get("image_is_fallback"))}\nFallback visuals: {sum(1 for a in published if a.get("image_is_fallback"))}\nDate rejected: {len(rejected_date_filter)}\n",
                      encoding="utf-8",
                  )
              (OUTPUT_DIR / ".nojekyll").write_text("", encoding="utf-8")
              log(json.dumps({
                  "version": VERSION,
                  "article_count": len(published),
                  "source_images_embedded": sum(1 for a in published if not a.get("image_is_fallback")),
                  "fallback_visuals": sum(1 for a in published if a.get("image_is_fallback")),
                  "source_image_failures_with_fallback": len(rejected_no_image),
                  "date_rejected_count": len(rejected_date_filter),
                  "topics": topic_counts,
              }, ensure_ascii=False, indent=2))
              if len(published) == 0:
                  log("WARNING: no articles published. The site is still deployed with diagnostic status.json.")

          if __name__ == "__main__":
              main()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
