name: CGI AI Retail & Consumer Services Weekstream - source images converted

on:
  workflow_dispatch:
  schedule:
    # Vrijdag 07:30 Europe/Amsterdam.
    # Geen extra tijd-guard: als GitHub vertraagt, publiceert hij alsnog.
    - cron: "30 7 * * 5"
      timezone: Europe/Amsterdam

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Installeer image tooling
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade pillow

      - name: Build weekstream met echte bronafbeeldingen
        shell: bash
        env:
          MIN_SOURCE_IMAGE_ARTICLES: "1"
        run: |
          python3 - <<'PY'
          import os, re, json, html, hashlib, shutil, sys
          import urllib.request, urllib.parse, urllib.error
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from PIL import Image, ImageOps, ImageFile
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from email.utils import parsedate_to_datetime

          VERSION = "v8.0-source-images-converted"
          ACCESS_CODE = "NT2026!"
          AMSTERDAM = ZoneInfo("Europe/Amsterdam")
          NOW = datetime.now(AMSTERDAM)
          UTC_NOW = datetime.now(timezone.utc)
          LOOKBACK_HOURS = 168
          MAX_ARTICLES = 40
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          MIN_SOURCE_IMAGE_ARTICLES = int(os.environ.get("MIN_SOURCE_IMAGE_ARTICLES") or "1")

          SOURCES = [
              {"name":"TechCrunch AI", "kind":"ai", "url":"https://techcrunch.com/category/artificial-intelligence/feed/"},
              {"name":"The Verge AI", "kind":"ai", "url":"https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"},
              {"name":"WIRED AI", "kind":"ai", "url":"https://www.wired.com/feed/tag/artificial-intelligence/latest/rss"},
              {"name":"MIT News AI", "kind":"ai", "url":"https://news.mit.edu/rss/topic/artificial-intelligence2"},
              {"name":"OpenAI News", "kind":"ai", "url":"https://openai.com/news/rss.xml"},
              {"name":"Google DeepMind Blog", "kind":"ai", "url":"https://deepmind.google/blog/rss.xml"},
              {"name":"Anthropic News", "kind":"ai", "url":"https://www.anthropic.com/news/rss.xml"},
              {"name":"VentureBeat AI", "kind":"ai", "url":"https://venturebeat.com/category/ai/feed/"},
              {"name":"The Decoder", "kind":"ai", "url":"https://the-decoder.com/feed/"},
              {"name":"NVIDIA Blog", "kind":"ai", "url":"https://blogs.nvidia.com/blog/category/deep-learning/feed/"},
              {"name":"Microsoft AI Blog", "kind":"ai", "url":"https://blogs.microsoft.com/ai/feed/"},
              {"name":"Retail Dive", "kind":"retail", "url":"https://www.retaildive.com/feeds/news/"},
              {"name":"Modern Retail", "kind":"retail", "url":"https://www.modernretail.co/feed/"},
              {"name":"RetailWire", "kind":"retail", "url":"https://retailwire.com/feed/"},
              {"name":"Grocery Dive", "kind":"retail", "url":"https://www.grocerydive.com/feeds/news/"},
              {"name":"Digital Commerce 360", "kind":"retail", "url":"https://www.digitalcommerce360.com/feed/"},
              {"name":"NRF", "kind":"retail", "url":"https://nrf.com/rss.xml"},
          ]

          AI_TERMS = ["ai", "artificial intelligence", "genai", "generative ai", "llm", "language model", "foundation model", "agent", "agents", "automation", "machine learning", "deep learning", "computer vision", "copilot", "chatbot", "robotics", "model", "openai", "anthropic", "gemini", "claude"]
          RETAIL_TERMS = ["retail", "consumer", "commerce", "ecommerce", "e-commerce", "store", "stores", "shopper", "customer", "loyalty", "personalization", "supply chain", "inventory", "pricing", "merchandising", "marketplace", "grocery", "fulfillment", "last-mile", "omnichannel", "checkout", "retail media"]
          TECH_RETAIL_TERMS = ["ai", "automation", "data", "digital", "technology", "platform", "cloud", "analytics", "personalization", "loyalty", "commerce", "ecommerce", "supply chain", "inventory", "pricing", "forecast", "media", "marketplace"]

          TOPICS = [
              ("retail", "Retail & Consumer Services", RETAIL_TERMS),
              ("agents", "AI Agents & Automation", ["agent", "agents", "autonomous", "workflow", "automation", "copilot"]),
              ("models", "GenAI & Foundation Models", ["model", "foundation", "llm", "language model", "multimodal", "gemini", "claude", "gpt", "openai", "deepmind", "anthropic"]),
              ("customer", "Customer & Loyalty", ["customer", "shopper", "loyalty", "personalization", "experience", "crm", "recommendation"]),
              ("stores", "Store Operations", ["store", "stores", "checkout", "associate", "workforce", "robot", "shelf", "in-store"]),
              ("supply", "Supply Chain & Forecasting", ["supply chain", "inventory", "forecast", "demand", "warehouse", "fulfillment", "logistics"]),
              ("pricing", "Pricing & Merchandising", ["pricing", "price", "promotion", "merchandising", "assortment", "markdown"]),
              ("data", "Data, Platforms & Cloud", ["data", "platform", "cloud", "api", "infrastructure", "chip", "gpu", "database"]),
              ("governance", "Governance, Risk & Responsible AI", ["governance", "risk", "responsible", "safety", "security", "privacy", "regulation", "policy", "copyright"]),
              ("research", "Research & Market Signals", ["research", "paper", "benchmark", "study", "report", "trend", "funding", "startup"]),
          ]

          BAD_IMAGE_WORDS = ["logo", "favicon", "icon", "sprite", "avatar", "author", "profile", "placeholder", "blank", "transparent", "pixel", "tracking", "badge", "app-store", "play-store", "newsletter"]
          HEADERS_HTML = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9,nl;q=0.8",
          }
          HEADERS_IMAGE = {
              "User-Agent": HEADERS_HTML["User-Agent"],
              # Vraag expliciet om browser-veilige rasterbeelden. Geen AVIF als voorkeur,
              # omdat sommige CDNs AVIF teruggeven dat daarna verkeerd geserveerd kan worden.
              "Accept": "image/jpeg,image/png,image/webp,image/apng,image/*;q=0.7,*/*;q=0.3",
              "Accept-Language": HEADERS_HTML["Accept-Language"],
          }

          def log(msg):
              print(msg, flush=True)

          def ensure_dir(p):
              os.makedirs(p, exist_ok=True)

          def clean_text(s):
              if not s: return ""
              s = re.sub(r"<script[\s\S]*?</script>", " ", s, flags=re.I)
              s = re.sub(r"<style[\s\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              s = html.unescape(s)
              s = re.sub(r"\s+", " ", s).strip()
              return s

          def h(s):
              return html.escape(str(s or ""), quote=True)

          def fetch_bytes(url, timeout=20, headers=None, referer=None):
              hdrs = dict(headers or HEADERS_HTML)
              if referer:
                  hdrs["Referer"] = referer
              req = urllib.request.Request(url, headers=hdrs)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  data = resp.read()
                  final_url = resp.geturl()
                  ctype = resp.headers.get("Content-Type", "")
                  return data, final_url, ctype

          def fetch_text(url, timeout=20):
              data, final_url, ctype = fetch_bytes(url, timeout=timeout, headers=HEADERS_HTML)
              enc = "utf-8"
              m = re.search(r"charset=([\w\-]+)", ctype, re.I)
              if m: enc = m.group(1)
              try:
                  text = data.decode(enc, errors="replace")
              except Exception:
                  text = data.decode("utf-8", errors="replace")
              return text, final_url, ctype

          def local_name(tag):
              return tag.split("}", 1)[-1].lower() if "}" in tag else tag.lower()

          def child_text(elem, names):
              wanted = {n.lower() for n in names}
              for ch in list(elem):
                  if local_name(ch.tag) in wanted:
                      txt = "".join(ch.itertext()).strip()
                      if txt: return html.unescape(txt)
              return ""

          def child_attr(elem, local, attr):
              for ch in list(elem):
                  if local_name(ch.tag) == local and ch.attrib.get(attr):
                      return ch.attrib.get(attr)
              return ""

          def parse_date(s):
              if not s: return None
              s = html.unescape(s).strip()
              try:
                  dt = parsedate_to_datetime(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              try:
                  dt = datetime.fromisoformat(s.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def abs_url(url, base):
              if not url: return ""
              url = html.unescape(url).strip().strip('"\'')
              if url.startswith("//"):
                  return "https:" + url
              return urllib.parse.urljoin(base, url)

          def extract_img_from_html_fragment(fragment, base):
              urls = []
              for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original|data-lazy-src)=['\"]([^'\"]+)['\"]", fragment or "", re.I):
                  urls.append(abs_url(m.group(1), base))
              return urls

          def feed_image_candidates(elem, base):
              urls = []
              for node in elem.iter():
                  ln = local_name(node.tag)
                  attrs = {local_name(k): v for k, v in node.attrib.items()}
                  if ln in ("thumbnail", "content") and attrs.get("url"):
                      typ = attrs.get("type", "").lower()
                      medium = attrs.get("medium", "").lower()
                      if ln == "thumbnail" or "image" in typ or medium == "image":
                          urls.append(abs_url(attrs.get("url"), base))
                  if ln == "enclosure" and attrs.get("url"):
                      typ = attrs.get("type", "").lower()
                      if "image" in typ:
                          urls.append(abs_url(attrs.get("url"), base))
                  if ln == "image" and attrs.get("href"):
                      urls.append(abs_url(attrs.get("href"), base))
              desc = child_text(elem, ["description", "summary", "content", "encoded"])
              urls.extend(extract_img_from_html_fragment(desc, base))
              return dedupe(urls)

          def article_html_image_candidates(article_url):
              try:
                  page, final_url, ctype = fetch_text(article_url, timeout=18)
              except Exception as e:
                  return [], f"article html fetch failed: {type(e).__name__}: {e}"
              candidates = []
              # Open Graph and Twitter cards
              meta_pat = re.compile(r"<meta\s+[^>]*(?:property|name)=['\"]([^'\"]+)['\"][^>]*content=['\"]([^'\"]+)['\"][^>]*>|<meta\s+[^>]*content=['\"]([^'\"]+)['\"][^>]*(?:property|name)=['\"]([^'\"]+)['\"][^>]*>", re.I)
              for m in meta_pat.finditer(page):
                  prop = (m.group(1) or m.group(4) or "").strip().lower()
                  content = (m.group(2) or m.group(3) or "").strip()
                  if prop in ["og:image", "og:image:url", "og:image:secure_url", "twitter:image", "twitter:image:src"]:
                      candidates.append(abs_url(content, final_url))
              # link rel=image_src
              for m in re.finditer(r"<link\s+[^>]*rel=['\"][^'\"]*image_src[^'\"]*['\"][^>]*href=['\"]([^'\"]+)['\"][^>]*>", page, re.I):
                  candidates.append(abs_url(m.group(1), final_url))
              # JSON-LD image fields
              for m in re.finditer(r"<script[^>]+type=['\"]application/ld\+json['\"][^>]*>([\s\S]*?)</script>", page, re.I):
                  raw = html.unescape(m.group(1).strip())
                  try:
                      data = json.loads(raw)
                      for img in find_json_images(data):
                          candidates.append(abs_url(img, final_url))
                  except Exception:
                      # Very small regex fallback for non-strict JSON-LD
                      for im in re.finditer(r"['\"]image['\"]\s*:\s*['\"]([^'\"]+)['\"]", raw, re.I):
                          candidates.append(abs_url(im.group(1), final_url))
              # If no card image: first reasonable article images.
              if len(candidates) < 2:
                  for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original|data-lazy-src)=['\"]([^'\"]+)['\"][^>]*>", page, re.I):
                      tag = m.group(0)
                      url = abs_url(m.group(1), final_url)
                      if likely_bad_image_url(url):
                          continue
                      # Prefer images that look content-related.
                      if re.search(r"(wp-content|uploads|image|photo|media|cdn|assets|article|news)", url, re.I) or re.search(r"width=['\"]?[4-9][0-9]{2,}", tag, re.I):
                          candidates.append(url)
              return dedupe(candidates), "ok"

          def find_json_images(obj):
              found = []
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k.lower() == "image":
                          if isinstance(v, str): found.append(v)
                          elif isinstance(v, list):
                              for x in v:
                                  if isinstance(x, str): found.append(x)
                                  elif isinstance(x, dict) and isinstance(x.get("url"), str): found.append(x["url"])
                          elif isinstance(v, dict) and isinstance(v.get("url"), str):
                              found.append(v["url"])
                      else:
                          found.extend(find_json_images(v))
              elif isinstance(obj, list):
                  for x in obj:
                      found.extend(find_json_images(x))
              return found

          def dedupe(seq):
              out, seen = [], set()
              for x in seq:
                  if not x: continue
                  x = x.strip()
                  if x not in seen:
                      out.append(x); seen.add(x)
              return out

          def likely_bad_image_url(url):
              low = (url or "").lower()
              if not low or low.startswith("data:"):
                  return True
              return any(w in low for w in BAD_IMAGE_WORDS)

          def image_ext(ctype, url):
              ct = (ctype or "").lower()
              if "jpeg" in ct or "jpg" in ct: return ".jpg"
              if "png" in ct: return ".png"
              if "webp" in ct: return ".webp"
              if "gif" in ct: return ".gif"
              if "svg" in ct: return ".svg"
              path = urllib.parse.urlparse(url).path.lower()
              for ext in [".jpg", ".jpeg", ".png", ".webp", ".gif", ".svg"]:
                  if path.endswith(ext): return ".jpg" if ext == ".jpeg" else ext
              return ".jpg"

          def normalize_source_image(data, output_dir, slug):
              """Validate a downloaded source image and write a local JPG that browsers/GitHub Pages serve reliably."""
              img = Image.open(BytesIO(data))
              img.load()
              w, hgt = img.size
              if w < 420 or hgt < 220:
                  raise ValueError(f"image_too_small:{w}x{hgt}")
              # Convert animated/webp/png/jpeg/etc. to one predictable local JPEG.
              if getattr(img, "is_animated", False):
                  img.seek(0)
              img = img.convert("RGB")
              # Crop to 16:9 so every card has a consistent source image frame.
              img = ImageOps.fit(img, (1200, 675), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              filename = f"{slug}.jpg"
              path = os.path.join(output_dir, filename)
              img.save(path, format="JPEG", quality=86, optimize=True, progressive=True)
              return path, img.size

          def download_source_image(candidates, article_url, output_dir, slug):
              reasons = []
              for idx, url in enumerate(dedupe(candidates)):
                  if likely_bad_image_url(url):
                      reasons.append({"url": url, "status": "skipped_bad_url"})
                      continue
                  try:
                      data, final_url, ctype = fetch_bytes(url, timeout=24, headers=HEADERS_IMAGE, referer=article_url)
                      ct = (ctype or "").lower()
                      if not ("image" in ct or re.search(r"\.(jpe?g|png|webp|gif|avif)(\?|$)", final_url.lower())):
                          reasons.append({"url": url, "status": f"not_image:{ctype}"})
                          continue
                      if len(data) < 10000:
                          reasons.append({"url": url, "status": f"too_small_bytes:{len(data)}"})
                          continue
                      try:
                          path, size = normalize_source_image(data, output_dir, slug)
                      except Exception as conv:
                          reasons.append({"url": url, "status": f"image_conversion_failed:{type(conv).__name__}:{str(conv)[:160]}", "content_type": ctype, "bytes": len(data)})
                          continue
                      filename = os.path.basename(path)
                      return {"ok": True, "path": f"assets/images/{filename}", "url": final_url, "method_index": idx, "bytes": len(data), "content_type": ctype, "local_format": "jpg", "local_size": size, "reasons": reasons}
                  except Exception as e:
                      reasons.append({"url": url, "status": f"download_failed:{type(e).__name__}:{str(e)[:160]}"})
              return {"ok": False, "reasons": reasons[:12]}

          def parse_feed_items(source):
              log(f"Fetching feed: {source['name']} | {source['url']}")
              try:
                  xml_text, final_url, ctype = fetch_text(source["url"], timeout=25)
              except Exception as e:
                  return [], {"source": source["name"], "ok": False, "error": f"feed fetch failed: {type(e).__name__}: {e}"}
              try:
                  root = ET.fromstring(xml_text.encode("utf-8"))
              except Exception as e:
                  return regex_parse_feed(xml_text, source, final_url), {"source": source["name"], "ok": True, "warning": f"xml parse fallback: {type(e).__name__}"}
              entries = []
              for elem in root.iter():
                  if local_name(elem.tag) in ("item", "entry"):
                      title = clean_text(child_text(elem, ["title"]))
                      link = ""
                      if local_name(elem.tag) == "entry":
                          for ch in list(elem):
                              if local_name(ch.tag) == "link" and (ch.attrib.get("href")):
                                  rel = ch.attrib.get("rel", "alternate")
                                  if rel in ("alternate", ""):
                                      link = abs_url(ch.attrib.get("href"), final_url); break
                      if not link:
                          link = abs_url(child_text(elem, ["link"]), final_url)
                      if not title or not link:
                          continue
                      date = parse_date(child_text(elem, ["pubDate", "published", "updated", "dc:date", "date"]))
                      desc = clean_text(child_text(elem, ["description", "summary", "content", "encoded"]))
                      cats = []
                      for ch in elem.iter():
                          if local_name(ch.tag) == "category":
                              term = ch.attrib.get("term") or "".join(ch.itertext())
                              term = clean_text(term)
                              if term: cats.append(term)
                      entries.append({
                          "source": source["name"], "source_kind": source["kind"], "title": title,
                          "url": link, "published": date, "description": desc,
                          "categories": dedupe(cats), "feed_image_candidates": feed_image_candidates(elem, link),
                      })
              return entries, {"source": source["name"], "ok": True, "count": len(entries)}

          def regex_parse_feed(xml_text, source, base):
              blocks = re.findall(r"<(item|entry)\b[\s\S]*?</\1>", xml_text, flags=re.I)
              # The regex above returns only tag name due to group; use another pass.
              item_blocks = re.findall(r"<item\b[\s\S]*?</item>|<entry\b[\s\S]*?</entry>", xml_text, flags=re.I)
              entries = []
              for block in item_blocks[:40]:
                  def tag(name):
                      m = re.search(rf"<{name}\b[^>]*>([\s\S]*?)</{name}>", block, re.I)
                      return clean_text(m.group(1)) if m else ""
                  title = tag("title")
                  link = tag("link")
                  if not link:
                      m = re.search(r"<link[^>]+href=['\"]([^'\"]+)['\"]", block, re.I)
                      link = m.group(1) if m else ""
                  link = abs_url(link, base)
                  if not title or not link: continue
                  desc = tag("description") or tag("summary")
                  entries.append({"source":source["name"], "source_kind":source["kind"], "title":title, "url":link, "published":parse_date(tag("pubDate") or tag("published") or tag("updated")), "description":desc, "categories":[], "feed_image_candidates":extract_img_from_html_fragment(block, link)})
              return entries

          def relevance(item):
              text = f"{item['title']} {item.get('description','')} {' '.join(item.get('categories',[]))}".lower()
              ai = sum(1 for term in AI_TERMS if term in text)
              retail = sum(1 for term in RETAIL_TERMS if term in text)
              techretail = sum(1 for term in TECH_RETAIL_TERMS if term in text)
              # General AI sources need AI relevance. Retail sources need AI/tech/commerce relevance.
              if item["source_kind"] == "ai" and ai < 1:
                  return 0, ai, retail
              if item["source_kind"] == "retail" and techretail < 1:
                  return 0, ai, retail
              score = ai * 3 + retail * 2 + techretail + (3 if item["source_kind"] == "retail" else 0)
              return score, ai, retail

          def classify(item):
              text = f"{item['title']} {item.get('description','')} {' '.join(item.get('categories',[]))}".lower()
              out = []
              for tid, label, terms in TOPICS:
                  if any(t in text for t in terms):
                      out.append({"id": tid, "label": label})
              if not out:
                  out.append({"id":"research", "label":"Research & Market Signals"})
              return out[:4]

          def summary_for(item):
              d = item.get("description") or ""
              if len(d) > 240:
                  d = d[:237].rsplit(" ", 1)[0] + "..."
              if len(d) < 60:
                  d = "Een relevant signaal uit de internationale AI- en retailnieuwsstroom. Bekijk het bronartikel voor de volledige context en details."
              return d

          def cgi_angle(item, topics):
              topic_ids = {t["id"] for t in topics}
              if "retail" in topic_ids and ("customer" in topic_ids or "pricing" in topic_ids):
                  return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan klantwaarde, personalisatie, commerciële besluitvorming en de manier waarop retailers AI vertalen naar concrete omnichannel proposities."
              if "supply" in topic_ids or "stores" in topic_ids:
                  return "Relevant voor CGI Retail & Consumer Services omdat dit aanknopingspunten geeft voor gesprekken over operationele efficiency, store execution, forecast accuracy en schaalbare AI in de dagelijkse retailoperatie."
              if "governance" in topic_ids:
                  return "Relevant voor CGI omdat klanten AI sneller willen opschalen, maar daarbij vragen hebben over governance, risico, security, compliance en verantwoord gebruik in bestaande IT- en datalandschappen."
              if "data" in topic_ids:
                  return "Relevant voor CGI omdat succesvolle AI-adoptie sterk afhankelijk is van datavolwassenheid, platformkeuzes, integratiearchitectuur en cloud-infrastructuur bij retail- en consumer-services-klanten."
              if "agents" in topic_ids or "models" in topic_ids:
                  return "Relevant voor CGI omdat nieuwe model- en agentontwikkelingen invloed hebben op klantverwachtingen, delivery-aanpak, automatiseringskansen en toekomstige AI-proposities voor retail- en consumer-services-klanten."
              return "Relevant om te volgen voor CGI Retail & Consumer Services als markt- en technologiesignaal: het helpt het team scherp te blijven op AI-ontwikkelingen die klantvragen, vendor-roadmaps en proposities kunnen beïnvloeden."

          # Prepare directories
          if os.path.exists("site"):
              shutil.rmtree("site")
          ensure_dir("site/assets/images")

          # Collect candidates
          all_items = []
          feed_status = []
          for source in SOURCES:
              items, st = parse_feed_items(source)
              feed_status.append(st)
              all_items.extend(items)

          # Dedupe by URL canonical-ish
          seen = set(); unique = []
          for item in all_items:
              key = urllib.parse.urlsplit(item["url"])._replace(query="", fragment="").geturl().rstrip("/").lower()
              if key in seen: continue
              seen.add(key); unique.append(item)

          cutoff = UTC_NOW - timedelta(hours=LOOKBACK_HOURS)
          relevant = []
          for item in unique:
              if item.get("published") and item["published"] < cutoff:
                  continue
              score, ai, retail = relevance(item)
              if score <= 0:
                  continue
              item["score"] = score
              item["ai_score"] = ai
              item["retail_score"] = retail
              relevant.append(item)
          relevant.sort(key=lambda x: (x.get("score",0), x.get("published") or datetime(1970,1,1,tzinfo=timezone.utc)), reverse=True)

          # Fetch source images. Hard rule: visible articles must have a downloaded source image.
          accepted = []
          rejected = []
          for idx, item in enumerate(relevant[:90], start=1):
              candidates = list(item.get("feed_image_candidates") or [])
              more, html_status = article_html_image_candidates(item["url"])
              candidates.extend(more)
              slug = f"article-{idx:03d}-{hashlib.sha1(item['url'].encode()).hexdigest()[:8]}"
              dl = download_source_image(candidates, item["url"], "site/assets/images", slug)
              if dl.get("ok"):
                  item["image"] = dl["path"]
                  item["image_original_url"] = dl["url"]
                  item["image_content_type"] = dl.get("content_type")
                  item["image_bytes"] = dl.get("bytes")
                  item["topics"] = classify(item)
                  item["summary"] = summary_for(item)
                  item["cgi_angle"] = cgi_angle(item, item["topics"])
                  accepted.append(item)
                  log(f"SOURCE IMAGE OK: {item['source']} | {item['title'][:70]} | {dl['url'][:90]}")
              else:
                  rejected.append({"title": item["title"], "source": item["source"], "url": item["url"], "html_status": html_status, "reasons": dl.get("reasons", [])})
                  log(f"NO SOURCE IMAGE: {item['source']} | {item['title'][:70]}")
              if len(accepted) >= MAX_ARTICLES:
                  break

          if len(accepted) < MIN_SOURCE_IMAGE_ARTICLES:
              ensure_dir("site")
              with open("site/status.json", "w", encoding="utf-8") as f:
                  json.dump({"version": VERSION, "ok": False, "reason": "no_source_images", "accepted": len(accepted), "rejected_sample": rejected[:15], "feed_status": feed_status}, f, ensure_ascii=False, indent=2)
              raise SystemExit(f"Geen of te weinig artikelen met echte bronafbeelding gevonden. Accepted={len(accepted)}. Publicatie gestopt zodat er geen kaarten zonder bronbeeld live gaan.")

          # Build topic counts and weekly summary
          topic_counts = {}
          for item in accepted:
              for t in item["topics"]:
                  topic_counts[t["label"]] = topic_counts.get(t["label"], 0) + 1
          top_topic_names = [k for k, v in sorted(topic_counts.items(), key=lambda kv: kv[1], reverse=True)[:3]]
          week_summary = "Deze week laat de internationale AI-nieuwsstroom vooral beweging zien rond " + ", ".join(top_topic_names).lower() + ". Voor CGI Retail & Consumer Services zijn vooral artikelen relevant die raken aan klantinteractie, operationele retailprocessen, dataplatformen, governance en de vertaling van AI naar schaalbare klantoplossingen."

          def fmt_date(dt):
              if not dt: return "Datum onbekend"
              return dt.astimezone(AMSTERDAM).strftime("%d %b %Y")

          def render_articles(items, section_id="all"):
              parts = []
              for i, item in enumerate(items, 1):
                  topics = item["topics"]
                  topic_ids = " ".join(t["id"] for t in topics)
                  tags_html = "".join([f'<button class="tag" data-filter="{h(t["id"])}">{h(t["label"])}</button>' for t in topics])
                  parts.append(f'''
                  <article class="card" data-topics="{h(topic_ids)}">
                    <div class="visual">
                      <img src="{h(item['image'])}" alt="Bronafbeelding bij {h(item['title'])}" loading="lazy">
                      <div class="image-badge">Bronafbeelding</div>
                    </div>
                    <div class="card-body">
                      <div class="meta"><span>{h(item['source'])}</span><span>{h(fmt_date(item.get('published')))}</span></div>
                      <h3>{h(item['title'])}</h3>
                      <p class="summary">{h(item['summary'])}</p>
                      <div class="angle"><strong>CGI Angle:</strong> {h(item['cgi_angle'])}</div>
                      <div class="tags">{tags_html}</div>
                      <a class="source-button" href="{h(item['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel →</a>
                    </div>
                  </article>''')
              return "\n".join(parts)

          filter_buttons = ['<button class="filter active" data-filter="all">Alle artikelen</button>']
          for tid, label, _ in TOPICS:
              count = sum(1 for item in accepted if any(t["id"] == tid for t in item["topics"]))
              if count:
                  filter_buttons.append(f'<button class="filter" data-filter="{h(tid)}">{h(label)} <span>{count}</span></button>')
          filters_html = "\n".join(filter_buttons)
          retail_items = [it for it in accepted if any(t["id"] == "retail" for t in it["topics"])]
          if not retail_items:
              retail_items = accepted[:6]

          def build_html():
              articles_html = render_articles(accepted)
              retail_html = render_articles(retail_items)
              generated = NOW.strftime("%d %B %Y %H:%M")
              return f'''<!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="cache-control" content="no-cache">
            <title>CGI AI & Retail Weekstream</title>
            <style>
              :root {{ --cgi-red:#e31937; --cgi-purple:#5236ab; --cgi-black:#000; --cgi-white:#fff; --soft:#f6f4f7; --line:#e8e3eb; --text:#111; --muted:#5f5a66; }}
              * {{ box-sizing:border-box; }}
              body {{ margin:0; font-family: Arial, Helvetica, sans-serif; color:var(--text); background:linear-gradient(180deg,#fff 0,#faf8fb 100%); }}
              .locked {{ overflow:hidden; }}
              .login {{ position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple)); padding:24px; }}
              .login-card {{ width:min(520px,100%); background:#fff; border-radius:28px; padding:32px; box-shadow:0 30px 80px rgba(0,0,0,.28); }}
              .logo {{ font-weight:900; letter-spacing:-2px; font-size:42px; color:var(--cgi-red); }}
              .login h1 {{ margin:12px 0 8px; font-size:28px; }}
              .login p {{ color:var(--muted); line-height:1.55; }}
              .login input {{ width:100%; padding:16px 18px; border:2px solid var(--line); border-radius:14px; font-size:18px; margin:12px 0; }}
              .login button, .source-button, .filter.active {{ background:var(--cgi-red); color:#fff; }}
              .login button {{ width:100%; border:0; padding:15px 18px; border-radius:999px; font-weight:800; font-size:16px; cursor:pointer; }}
              .error {{ color:var(--cgi-red); font-weight:700; display:none; }}
              .page {{ display:none; }}
              header {{ background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple)); color:#fff; padding:42px 24px 52px; }}
              .wrap {{ max-width:1180px; margin:0 auto; }}
              .topline {{ display:flex; justify-content:space-between; gap:24px; align-items:flex-start; flex-wrap:wrap; }}
              .brand {{ font-weight:900; font-size:46px; letter-spacing:-2px; }}
              .badge {{ display:inline-flex; padding:9px 13px; border:1px solid rgba(255,255,255,.35); border-radius:999px; font-size:13px; background:rgba(255,255,255,.12); }}
              h1 {{ font-size:clamp(34px,6vw,68px); line-height:.95; letter-spacing:-3px; max-width:900px; margin:34px 0 18px; }}
              .sub {{ max-width:820px; color:rgba(255,255,255,.9); font-size:18px; line-height:1.55; }}
              .stats {{ margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; }}
              .stat {{ background:#fff; color:#000; border-radius:18px; padding:16px 20px; min-width:170px; }}
              .stat strong {{ display:block; font-size:28px; }}
              main {{ padding:34px 24px 70px; }}
              .section {{ margin:0 auto 34px; max-width:1180px; }}
              .panel {{ background:#fff; border:1px solid var(--line); border-radius:26px; padding:26px; box-shadow:0 10px 30px rgba(36,20,50,.06); }}
              .panel h2, .section h2 {{ margin:0 0 12px; font-size:30px; letter-spacing:-1px; }}
              .panel p {{ margin:0; color:var(--muted); line-height:1.65; font-size:17px; }}
              .filters {{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }}
              .filter {{ border:1px solid var(--line); background:#fff; color:#111; border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:700; }}
              .filter span {{ opacity:.65; margin-left:4px; }}
              .grid {{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }}
              .card {{ background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:0 12px 28px rgba(36,20,50,.07); display:flex; flex-direction:column; min-width:0; }}
              .visual {{ position:relative; width:100%; aspect-ratio:16/9; background:#e9e6ee; overflow:hidden; }}
              .visual img {{ width:100%; height:100%; object-fit:cover; display:block; }}
              .image-badge {{ position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,.72); color:#fff; border-radius:999px; padding:7px 10px; font-size:12px; font-weight:800; }}
              .card-body {{ padding:18px; display:flex; flex-direction:column; gap:12px; flex:1; }}
              .meta {{ display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; text-transform:uppercase; font-weight:800; letter-spacing:.04em; }}
              h3 {{ margin:0; font-size:20px; line-height:1.18; letter-spacing:-.3px; }}
              .summary {{ margin:0; color:#3d3745; line-height:1.5; }}
              .angle {{ background:#f8f5fa; border-left:4px solid var(--cgi-purple); border-radius:14px; padding:12px; line-height:1.45; color:#2d2638; }}
              .tags {{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }}
              .tag {{ border:1px solid #e4dcea; background:#fff; color:#5236ab; padding:7px 9px; border-radius:999px; font-size:12px; font-weight:800; cursor:pointer; }}
              .source-button {{ display:inline-flex; justify-content:center; align-items:center; text-decoration:none; border-radius:999px; padding:12px 16px; font-weight:900; margin-top:2px; box-shadow:0 8px 18px rgba(227,25,55,.18); }}
              .source-button:hover {{ transform:translateY(-1px); }}
              .empty {{ display:none; padding:30px; text-align:center; color:var(--muted); }}
              footer {{ border-top:1px solid var(--line); padding:28px 24px; color:var(--muted); font-size:14px; }}
              @media (max-width:950px) {{ .grid {{ grid-template-columns:repeat(2,minmax(0,1fr)); }} }}
              @media (max-width:640px) {{ header {{ padding:28px 18px 36px; }} main {{ padding:24px 14px 50px; }} .grid {{ grid-template-columns:1fr; }} .panel {{ padding:20px; }} .brand {{ font-size:36px; }} .meta {{ flex-direction:column; gap:4px; }} }}
            </style>
          </head>
          <body class="locked">
            <div class="login" id="login">
              <div class="login-card">
                <div class="logo">CGI</div>
                <h1>AI & Retail Weekstream</h1>
                <p>Voer de toegangscode in om de briefing te openen.</p>
                <input id="code" type="password" placeholder="Toegangscode" autocomplete="current-password">
                <button id="unlock">Open briefing</button>
                <p class="error" id="error">Onjuiste toegangscode.</p>
              </div>
            </div>
            <div class="page" id="page">
              <header>
                <div class="wrap">
                  <div class="topline"><div class="brand">CGI</div><div class="badge">{VERSION}</div></div>
                  <h1>AI & Retail Weekstream</h1>
                  <p class="sub">Wekelijkse selectie van internationale AI-ontwikkelingen en Retail & Consumer Services-signalen. Alleen artikelen met succesvol opgehaalde en lokaal geconverteerde bronafbeeldingen worden getoond.</p>
                  <div class="stats"><div class="stat"><strong>{len(accepted)}</strong> relevante artikelen</div></div>
                </div>
              </header>
              <main>
                <section class="section panel">
                  <h2>Weeksamenvatting</h2>
                  <p>{h(week_summary)}</p>
                </section>
                <section class="section panel">
                  <h2>Filter op topic</h2>
                  <div class="filters">{filters_html}</div>
                </section>
                <section class="section">
                  <h2>Alle relevante artikelen</h2>
                  <div class="grid" id="articleGrid">{articles_html}</div>
                  <div class="empty" id="empty">Geen artikelen binnen dit filter.</div>
                </section>
                <section class="section">
                  <h2>Retail & Consumer Services: relevante artikelen</h2>
                  <div class="grid">{retail_html}</div>
                </section>
              </main>
              <footer><div class="wrap">Gegenereerd op {h(generated)} Europe/Amsterdam · Iedere kaart gebruikt een bronafbeelding uit RSS, Open Graph, Twitter Card, JSON-LD of artikelpagina, lokaal opgeslagen als betrouwbare JPG.</div></footer>
            </div>
            <script>
              const ACCESS_CODE = {json.dumps(ACCESS_CODE)};
              const login = document.getElementById('login');
              const page = document.getElementById('page');
              const code = document.getElementById('code');
              const err = document.getElementById('error');
              function showPage() {{ login.style.display='none'; page.style.display='block'; document.body.classList.remove('locked'); }}
              if (localStorage.getItem('cgi_weekstream_access') === 'ok') showPage();
              document.getElementById('unlock').addEventListener('click', () => {{ if (code.value === ACCESS_CODE) {{ localStorage.setItem('cgi_weekstream_access','ok'); showPage(); }} else {{ err.style.display='block'; }} }});
              code.addEventListener('keydown', e => {{ if (e.key === 'Enter') document.getElementById('unlock').click(); }});
              function applyFilter(topic) {{
                document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === topic));
                let shown = 0;
                document.querySelectorAll('#articleGrid .card').forEach(card => {{
                  const topics = (card.dataset.topics || '').split(' ');
                  const visible = topic === 'all' || topics.includes(topic);
                  card.style.display = visible ? '' : 'none';
                  if (visible) shown++;
                }});
                document.getElementById('empty').style.display = shown ? 'none' : 'block';
              }}
              document.querySelectorAll('.filter,.tag').forEach(btn => btn.addEventListener('click', () => applyFilter(btn.dataset.filter || 'all')));
            </script>
          </body>
          </html>'''

          def write_site(dest):
              ensure_dir(dest)
              ensure_dir(os.path.join(dest, "assets"))
              # Copy image assets for relative paths under root and latest.
              if dest != "site":
                  if os.path.exists(os.path.join(dest, "assets")):
                      shutil.rmtree(os.path.join(dest, "assets"))
                  shutil.copytree("site/assets", os.path.join(dest, "assets"))
              with open(os.path.join(dest, "index.html"), "w", encoding="utf-8") as f:
                  f.write(build_html())
              status = {
                  "version": VERSION,
                  "generated_at": NOW.isoformat(),
                  "lookback_hours": LOOKBACK_HOURS,
                  "articles_published": len(accepted),
                  "source_images_downloaded": len(accepted),
                  "fallback_visuals": 0,
                  "strict_source_images": True,
                  "image_pipeline": "download_source_image_and_convert_to_local_jpg",
                  "articles_rejected_without_source_image": len(rejected),
                  "feed_status": feed_status,
                  "rejected_without_source_image_sample": rejected[:20],
                  "published_images": [{"title": it["title"], "source": it["source"], "page_url": it["url"], "image_original_url": it["image_original_url"], "local_path": it["image"]} for it in accepted[:50]],
              }
              with open(os.path.join(dest, "status.json"), "w", encoding="utf-8") as f:
                  json.dump(status, f, ensure_ascii=False, indent=2, default=str)
              with open(os.path.join(dest, "DEPLOYMENT_CHECK.txt"), "w", encoding="utf-8") as f:
                  f.write(f"{VERSION}\nPublished articles: {len(accepted)}\nSource images downloaded: {len(accepted)}\nFallback visuals: 0\n")

          write_site("site")
          write_site("site/latest")
          archive_dir = os.path.join("site", "archive", NOW.strftime("%G-W%V"))
          write_site(archive_dir)
          log(f"Published {len(accepted)} articles. All visible cards have downloaded source images. Rejected without image: {len(rejected)}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
