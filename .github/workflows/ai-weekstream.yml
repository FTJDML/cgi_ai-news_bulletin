              pieces.append("Voor CGI Retail & Consumer Services ligt de waarde vooral in signalen die helpen bij klantgesprekken over AI-adoptie, composable commerce, data- en platformvolwassenheid, integratie, governance, customer experience, store operations, supply chain en Nederlandse/EU-marktontwikkelingen.")
