          def normalize_space(s):
              return re.sub(r"\s+", " ", (s or "")).strip()

          def strip_tags(s):
              s = re.sub(r"<script[\s\S]*?</script>", " ", s or "", flags=re.I)
              s = re.sub(r"<style[\s\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              return normalize_space(html.unescape(s))

          def clean_url(url):
              if not url:
                  return ""
              try:
                  p = urllib.parse.urlsplit(url.strip())
                  q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query, keep_blank_values=True) if not k.lower().startswith("utm_")]
                  return urllib.parse.urlunsplit((p.scheme, p.netloc.lower(), p.path.rstrip("/"), urllib.parse.urlencode(q), ""))
              except Exception:
                  return url.strip()

          def request_bytes(url, max_bytes, timeout=HTTP_TIMEOUT, referer=None):
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,nl;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  ctype = resp.headers.get("content-type", "")
                  data = resp.read(max_bytes + 1)
                  if len(data) > max_bytes:
                      raise ValueError(f"response too large > {max_bytes}")
                  return data, ctype

          def request_text(url, max_bytes=MAX_HTML_BYTES, timeout=HTTP_TIMEOUT):
              data, ctype = request_bytes(url, max_bytes=max_bytes, timeout=timeout)
              m = re.search(r"charset=([^;]+)", ctype or "", flags=re.I)
              enc = m.group(1).strip() if m else "utf-8"
              try:
                  return data.decode(enc, errors="replace"), ctype
              except Exception:
                  return data.decode("utf-8", errors="replace"), ctype

          def tag_name(elem):
              return elem.tag.split("}")[-1].lower() if isinstance(elem.tag, str) else ""

          def find_child_text(elem, names):
              wanted = {n.lower() for n in names}
              for child in list(elem):
                  if tag_name(child) in wanted:
                      return normalize_space("".join(child.itertext()))
              return ""

          def find_link(elem):
              # RSS link text first
              for child in list(elem):
                  if tag_name(child) == "link":
                      href = child.attrib.get("href")
                      if href:
                          return href
                      txt = normalize_space("".join(child.itertext()))
                      if txt:
                          return txt
              return ""

          def parse_date(raw):
              raw = normalize_space(raw)
              if not raw:
                  return None
              # Remove common wrappers and whitespace that break parsedate/strptime.
              raw = html.unescape(raw).strip()
              raw = re.sub(r"\s+", " ", raw)
              try:
                  dt = email.utils.parsedate_to_datetime(raw)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              # Support common ISO variants, including fractional seconds.
              iso = raw.replace("Z", "+00:00")
              try:
                  dt = datetime.fromisoformat(iso)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              for fmt in ["%Y-%m-%dT%H:%M:%S%z", "%Y-%m-%dT%H:%M:%S", "%Y-%m-%d", "%d %B %Y", "%d %b %Y"]:
                  try:
                      dt = datetime.strptime(raw[:32], fmt)
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception:
                      pass
              return None


          def parse_date_from_url(url):
              """Extract a publication date from common URL patterns as a last resort."""
              try:
                  path = urllib.parse.urlsplit(url).path
              except Exception:
                  path = url or ""
              patterns = [
                  r"/(20\d{2})/(0[1-9]|1[0-2])/(0[1-9]|[12]\d|3[01])(?:/|$)",
                  r"/(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(?:-|/|$)",
                  r"/(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?:-|/|$)",
              ]
              for pat in patterns:
                  m = re.search(pat, path)
                  if m:
                      try:
                          return datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)), tzinfo=timezone.utc)
                      except Exception:
                          return None
              return None


          def extract_feed_published_date(node, article_url):
              """Return (dt, source_name, raw). Prefer real publication dates over updated dates.

              Older articles were slipping through because missing dates fell back to now_utc(),
              and because some feeds expose only an updated date. This function is strict:
              no parseable date means the item is not considered fresh.
              """
              publish_fields = ["pubDate", "published", "date", "dc:date", "issued", "created", "publicationdate"]
              updated_fields = ["updated", "modified", "dateModified"]
              for name in publish_fields:
                  raw = find_child_text(node, [name])
                  dt = parse_date(raw)
                  if dt:
                      return dt, name, raw
              # Atom feeds sometimes only expose updated. Keep it as provisional; the article page
              # will be checked later before publishing.
              for name in updated_fields:
                  raw = find_child_text(node, [name])
                  dt = parse_date(raw)
                  if dt:
                      return dt, f"{name}-provisional", raw
              url_dt = parse_date_from_url(article_url)
              if url_dt:
                  return url_dt, "url-date", article_url
              return None, "missing", ""


          def extract_published_date_from_page(page, article_url):
              """Extract a publication date from the source article page.

              Only publication-like fields count. dateModified/updated are intentionally not used
              as a final publication date, because they can make old evergreen articles look fresh.
              """
              checks = []
              meta_names = [
                  "article:published_time", "og:published_time", "pubdate", "publishdate", "publish_date",
                  "datepublished", "date_published", "sailthru.date", "parsely-pub-date",
                  "dc.date", "dc.date.issued", "date", "citation_publication_date",
              ]
              for name in meta_names:
                  escaped = re.escape(name)
                  patterns = [
                      rf"<meta[^>]+(?:property|name|itemprop)=['\"]{escaped}['\"][^>]+content=['\"]([^'\"]+)['\"]",
                      rf"<meta[^>]+content=['\"]([^'\"]+)['\"][^>]+(?:property|name|itemprop)=['\"]{escaped}['\"]",
                  ]
                  for pat in patterns:
                      for m in re.finditer(pat, page, flags=re.I):
                          checks.append((m.group(1), f"article:{name}"))
              # JSON-LD datePublished fields.
              for script_match in re.finditer(r"<script[^>]+type=['\"]application/ld\+json['\"][^>]*>([\s\S]*?)</script>", page, flags=re.I):
                  blob = html.unescape(script_match.group(1))
                  for key in ["datePublished", "uploadDate"]:
                      for m in re.finditer(rf'"{key}"\s*:\s*"([^"\\]+)"', blob, flags=re.I):
                          checks.append((m.group(1), f"article:jsonld:{key}"))
              # <time datetime="..."> is common in news templates.
              for m in re.finditer(r"<time[^>]+datetime=['\"]([^'\"]+)['\"]", page, flags=re.I):
                  checks.append((m.group(1), "article:time"))
              # Last resort: URL date.
              url_dt = parse_date_from_url(article_url)
              if url_dt:
                  return url_dt, "article:url-date", article_url
              for raw, source in checks:
                  dt = parse_date(raw)
                  if dt:
                      return dt, source, raw
              return None, "", ""


          def choose_effective_published_date(item, page_date=None, page_date_source=""):
              rss_date = item.get("published")
              rss_source = item.get("published_source", "")
              candidates = []
              if rss_date and "provisional" not in rss_source:
                  candidates.append((rss_date, rss_source or "rss"))
              if page_date:
                  candidates.append((page_date, page_date_source or "article-page"))
              if not candidates:
                  return None, "No verified publication date. Updated-only feed dates are not enough."
              # Use the oldest publication-like date found. This prevents old articles with recent
              # RSS updated dates from entering the 7-day briefing.
              effective, source = min(candidates, key=lambda x: x[0])
              now = now_utc()
              if effective > now + timedelta(hours=MAX_FUTURE_SKEW_HOURS):
                  return None, f"Publication date is in the future: {effective.isoformat()} via {source}"
              cutoff = now - timedelta(hours=LOOKBACK_HOURS)
              if effective < cutoff:
                  return None, f"Older than {LOOKBACK_HOURS} hours: {effective.isoformat()} via {source}; cutoff {cutoff.isoformat()}"
              return effective, source


          def extract_image_candidates_from_html_fragment(fragment, base_url, origin):
              out = []
              for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original)=['\"]([^'\"]+)['\"]", fragment or "", flags=re.I):
                  url = html.unescape(m.group(1))
                  if url.startswith("data:"):
                      continue
                  out.append({"url": urllib.parse.urljoin(base_url, url), "origin": origin})
              return out

          def extract_rss_image_candidates(item, article_url):
              candidates = []
              for el in item.iter():
                  name = tag_name(el)
                  attrs = {k.lower().split("}")[-1]: v for k, v in el.attrib.items()}
                  if name in {"content", "thumbnail", "image"} and attrs.get("url"):
                      candidates.append({"url": urllib.parse.urljoin(article_url, attrs["url"]), "origin": f"rss:{name}"})
                  if name == "enclosure" and attrs.get("url"):
                      typ = attrs.get("type", "")
                      if "image" in typ.lower() or re.search(r"\.(jpe?g|png|webp|gif|avif)(\?|$)", attrs["url"], flags=re.I):
                          candidates.append({"url": urllib.parse.urljoin(article_url, attrs["url"]), "origin": "rss:enclosure"})
                  if name == "image":
                      href = attrs.get("href") or attrs.get("url")
                      if href:
                          candidates.append({"url": urllib.parse.urljoin(article_url, href), "origin": "rss:image"})
              summary_html = find_child_text(item, ["description", "summary", "content", "encoded"])
              candidates.extend(extract_image_candidates_from_html_fragment(summary_html, article_url, "rss:html"))
              # Remove duplicates while preserving order.
              seen = set()
              unique = []
              for c in candidates:
                  u = clean_url(c.get("url"))
                  if u and u not in seen:
                      seen.add(u)
                      unique.append({"url": u, "origin": c.get("origin", "rss")})
              return unique

          def parse_feed(xml_text, source):
              root = ET.fromstring(xml_text)
              items = []
              nodes = [el for el in root.iter() if tag_name(el) in {"item", "entry"}]
              for node in nodes[:MAX_FEED_ITEMS_PER_SOURCE]:
                  title = find_child_text(node, ["title"])
                  url = find_link(node)
                  if not title or not url:
                      continue
                  summary_html = ""
                  for n in ["description", "summary", "content", "encoded"]:
                      txt = find_child_text(node, [n])
                      if txt:
                          summary_html = txt
                          break
                  summary = strip_tags(summary_html)
                  published, published_source, date_raw = extract_feed_published_date(node, url)
                  if published is None:
                      # Strict date mode: do not treat undated feed items as current news.
                      continue
                  cats = []
                  for el in node.iter():
                      if tag_name(el) == "category":
                          txt = normalize_space("".join(el.itertext())) or el.attrib.get("term", "")
                          if txt:
                              cats.append(txt)
                  url = clean_url(urllib.parse.urljoin(source["feeds"][0], html.unescape(url)))
                  items.append({
                      "source": source["name"],
                      "source_kind": source["kind"],
                      "source_boost": float(source.get("boost", 1.0)),
                      "title": strip_tags(title),
                      "url": url,
                      "summary": summary,
                      "published": published,
                      "published_source": published_source,
                      "rss_date_raw": date_raw,
                      "categories": cats[:8],
                      "rss_image_candidates": extract_rss_image_candidates(node, url),
                  })
              return items

          def count_terms(text, terms):
              text_l = f" {text.lower()} "
              score = 0
              hits = []
              for term in terms:
                  term_l = term.lower()
                  if " " in term_l or "-" in term_l:
                      if term_l in text_l:
                          score += 1
                          hits.append(term)
                  else:
                      if re.search(r"\b" + re.escape(term_l) + r"\b", text_l):
                          score += 1
                          hits.append(term)
              return score, hits

          def classify_and_score(item):
              text = " ".join([item["title"], item["summary"], " ".join(item.get("categories", [])), item["source"], item["source_kind"]])
              ai_score, ai_hits = count_terms(text, AI_TERMS)
              rcs_score, rcs_hits = count_terms(text, RCS_TERMS)
              enterprise_score, enterprise_hits = count_terms(text, ENTERPRISE_TERMS)
              vendor_score, vendor_hits = count_terms(text, VENDOR_TERMS)
              exclude_score, exclude_hits = count_terms(text, EXCLUDE_IF_ONLY)

              source_kind = item.get("source_kind", "")
              score = 0.0
              score += min(ai_score, 5) * 2.2
              score += min(rcs_score, 6) * 2.0
              score += min(enterprise_score, 5) * 1.5
              score += min(vendor_score, 4) * 0.8
              score += item.get("source_boost", 1.0)
              if source_kind in {"Retail & Consumer Services", "Retail Tech", "Commerce Platform", "Dutch market"}:
                  score += 2.2
              if source_kind in {"Enterprise AI", "Enterprise IT", "AI lab"}:
                  score += 1.4
              if ai_score > 0 and rcs_score > 0:
                  score += 3.0
              if ai_score > 0 and enterprise_score > 0:
                  score += 2.0
              if rcs_score > 0 and enterprise_score > 0:
                  score += 1.5
              if exclude_score > 0 and (enterprise_score + rcs_score + ai_score) < 4:
                  score -= 4.0

              # Hard editorial gates: no pure retail news without AI/IT angle; no broad AI without enterprise/RCS angle.
              eligible = False
              if source_kind in {"Retail & Consumer Services", "Retail Tech", "Commerce Platform", "Dutch market"}:
                  # Retail/commerce/NL-bronnen mogen ook niet-AI IT-transformatie signalen meenemen,
                  # zolang er duidelijke IT-, data-, platform-, security- of operational excellence waarde is.
                  eligible = rcs_score >= 1 and (ai_score >= 1 or enterprise_score >= 2 or vendor_score >= 1)
              elif source_kind in {"AI lab", "Enterprise AI", "Enterprise IT"}:
                  eligible = ai_score >= 1 and (enterprise_score >= 1 or rcs_score >= 1 or vendor_score >= 1)
              else:
                  eligible = ai_score >= 1 and (enterprise_score >= 1 or rcs_score >= 1)

              topics = []
              topic_hits = {}
              for topic, terms in TOPIC_RULES:
                  n, hits = count_terms(text, terms)
                  if n:
                      topics.append(topic)
                      topic_hits[topic] = hits[:5]
              if not topics:
                  topics = ["Research & Market Signals"]

              tags = []
              for t in topics[:4]:
                  tags.append(t)
              for h in (ai_hits + rcs_hits + enterprise_hits + vendor_hits):
                  pretty = h.strip().title()
                  if pretty not in tags and len(tags) < 8:
                      tags.append(pretty)

              item["score"] = round(score, 2)
              item["eligible"] = eligible and score >= MIN_RELEVANCE_SCORE
              item["topics"] = topics
              item["tags"] = tags[:8]
              item["score_detail"] = {
                  "ai": ai_score,
                  "retail_consumer_services": rcs_score,
                  "enterprise_it": enterprise_score,
                  "vendor": vendor_score,
                  "exclude": exclude_score,
                  "hits": {
                      "ai": ai_hits[:8],
                      "retail_consumer_services": rcs_hits[:8],
                      "enterprise_it": enterprise_hits[:8],
                      "vendor": vendor_hits[:8],
                      "exclude": exclude_hits[:5],
                  },
              }
              return item

          def fetch_article_metadata(article_url):
              """Fetch source page once and return image candidates plus publication date metadata."""
              try:
                  page, ctype = request_text(article_url, max_bytes=MAX_HTML_BYTES)
              except Exception as e:
                  return [], None, "", f"article page fetch failed: {e}"
              page_date, page_date_source, page_date_raw = extract_published_date_from_page(page, article_url)
              candidates = []
              # Open Graph / Twitter card.
              patterns = [
                  r"<meta[^>]+(?:property|name)=['\"]og:image(?::secure_url)?['\"][^>]+content=['\"]([^'\"]+)['\"]",
                  r"<meta[^>]+content=['\"]([^'\"]+)['\"][^>]+(?:property|name)=['\"]og:image(?::secure_url)?['\"]",
                  r"<meta[^>]+(?:property|name)=['\"]twitter:image(?::src)?['\"][^>]+content=['\"]([^'\"]+)['\"]",
                  r"<meta[^>]+content=['\"]([^'\"]+)['\"][^>]+(?:property|name)=['\"]twitter:image(?::src)?['\"]",
              ]
              for pat in patterns:
                  for m in re.finditer(pat, page, flags=re.I):
                      candidates.append({"url": urllib.parse.urljoin(article_url, html.unescape(m.group(1))), "origin": "article:meta"})
              # JSON-LD image fields.
              for script_match in re.finditer(r"<script[^>]+type=['\"]application/ld\+json['\"][^>]*>([\s\S]*?)</script>", page, flags=re.I):
                  blob = html.unescape(script_match.group(1))
                  for m in re.finditer(r'"image"\s*:\s*"([^"\\]+)"', blob):
                      candidates.append({"url": urllib.parse.urljoin(article_url, m.group(1)), "origin": "article:jsonld"})
                  for m in re.finditer(r'"url"\s*:\s*"([^"\\]+\.(?:jpg|jpeg|png|webp|gif|avif)(?:\?[^"\\]*)?)"', blob, flags=re.I):
                      candidates.append({"url": urllib.parse.urljoin(article_url, m.group(1)), "origin": "article:jsonld"})
              # Last resort: visible article images.
              for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original)=['\"]([^'\"]+)['\"][^>]*>", page, flags=re.I):
                  raw = html.unescape(m.group(1))
                  if raw.startswith("data:"):
                      continue
                  if any(x in raw.lower() for x in ["logo", "avatar", "icon", "sprite", "tracking", "pixel"]):
                      continue
                  candidates.append({"url": urllib.parse.urljoin(article_url, raw), "origin": "article:img"})
              seen = set()
              unique = []
              for c in candidates:
                  u = clean_url(c.get("url"))
                  if not u or u in seen:
                      continue
                  seen.add(u)
                  unique.append({"url": u, "origin": c.get("origin", "article")})
              return unique[:12], page_date, page_date_source, ""


          def source_image_to_data_uri(candidates, article_url):
              reasons = []
              for c in candidates[:16]:
                  url = c.get("url")
                  origin = c.get("origin", "unknown")
                  try:
                      data, ctype = request_bytes(url, max_bytes=MAX_IMAGE_BYTES, referer=article_url)
                      if len(data) < 3000:
                          reasons.append(f"{origin}: too small")
                          continue
                      img = Image.open(io.BytesIO(data))
                      img = ImageOps.exif_transpose(img)
                      if img.width < MIN_IMAGE_WIDTH or img.height < MIN_IMAGE_HEIGHT:
                          reasons.append(f"{origin}: dimensions {img.width}x{img.height} too small")
                          continue
                      img = img.convert("RGB")
                      # Center crop to 16:9 and save as safe JPEG.
                      target_ratio = 16 / 9
                      ratio = img.width / img.height
                      if ratio > target_ratio:
                          new_w = int(img.height * target_ratio)
                          left = (img.width - new_w) // 2
                          img = img.crop((left, 0, left + new_w, img.height))
                      elif ratio < target_ratio:
                          new_h = int(img.width / target_ratio)
                          top = (img.height - new_h) // 2
                          img = img.crop((0, top, img.width, top + new_h))
                      img = img.resize((1200, 675), Image.LANCZOS)
                      out = io.BytesIO()
                      img.save(out, format="JPEG", quality=82, optimize=True)
                      b64 = base64.b64encode(out.getvalue()).decode("ascii")
                      return {
                          "ok": True,
                          "data_uri": f"data:image/jpeg;base64,{b64}",
                          "source_image_url": url,
                          "source_image_origin": origin,
                          "source_image_content_type": ctype,
                          "attempts_before_success": reasons[:10],
                      }
                  except UnidentifiedImageError:
                      reasons.append(f"{origin}: not decodable image")
                  except Exception as e:
                      reasons.append(f"{origin}: {str(e)[:140]}")
              return {"ok": False, "reasons": reasons[:14]}

          def wrap_text(draw, text, font, max_width, max_lines=4):
              words = normalize_space(text).split()
              lines = []
              current = ""
              for word in words:
                  test = (current + " " + word).strip()
                  bbox = draw.textbbox((0, 0), test, font=font)
                  if bbox[2] - bbox[0] <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word
                  if len(lines) >= max_lines:
                      break
              if current and len(lines) < max_lines:
                  lines.append(current)
              if len(lines) == max_lines and len(words) > len(" ".join(lines).split()):
                  lines[-1] = lines[-1].rstrip(" .") + "..."
              return lines

          def fallback_visual_to_data_uri(item):
              # CGI-branded fallback, alleen gebruikt als een echte bronafbeelding niet downloadbaar is.
              W, H = 1200, 675
              img = Image.new("RGB", (W, H), "white")
              px = img.load()
              red = (227, 25, 55)
              purple = (82, 54, 171)
              black = (0, 0, 0)
              for y in range(H):
                  for x in range(W):
                      t = (x + y * 0.55) / (W + H * 0.55)
                      if t < 0.58:
                          k = t / 0.58
                          r = int(red[0] * (1-k) + 168 * k)
                          g = int(red[1] * (1-k) + 36 * k)
                          b = int(red[2] * (1-k) + 101 * k)
                      else:
                          k = (t - 0.58) / 0.42
                          r = int(168 * (1-k) + purple[0] * k)
                          g = int(36 * (1-k) + purple[1] * k)
                          b = int(101 * (1-k) + purple[2] * k)
                      px[x, y] = (r, g, b)
              draw = ImageDraw.Draw(img)
              try:
                  font_big = ImageFont.truetype("DejaVuSans-Bold.ttf", 58)
                  font_med = ImageFont.truetype("DejaVuSans-Bold.ttf", 34)
                  font_small = ImageFont.truetype("DejaVuSans.ttf", 24)
              except Exception:
                  font_big = font_med = font_small = ImageFont.load_default()
              # Decorative brand shapes.
              draw.rounded_rectangle((56, 48, 228, 116), radius=28, fill=(255, 255, 255))
              draw.text((86, 62), "CGI", fill=black, font=font_med)
              label = "AI + IT / Retail & Consumer Services"
              draw.rounded_rectangle((56, 140, 520, 188), radius=24, fill=(0, 0, 0, 110))
              draw.text((82, 151), label, fill=(255, 255, 255), font=font_small)
              title = item.get("title", "Relevant AI & IT signal")
              for i, line in enumerate(wrap_text(draw, title, font_big, 980, max_lines=3)):
                  draw.text((62, 245 + i * 68), line, fill=(255, 255, 255), font=font_big)
              source = item.get("source", "Bron")
              topic = (item.get("topics") or ["CGI RCS"])[0]
              footer = f"Geen downloadbaar bronbeeld · {source} · {topic}"
              draw.rounded_rectangle((56, 584, 1144, 632), radius=24, fill=(0, 0, 0))
              draw.text((82, 596), footer[:120], fill=(255, 255, 255), font=font_small)
              out = io.BytesIO()
              img.save(out, format="JPEG", quality=84, optimize=True)
              b64 = base64.b64encode(out.getvalue()).decode("ascii")
              return {
                  "ok": True,
                  "data_uri": f"data:image/jpeg;base64,{b64}",
                  "source_image_url": "",
                  "source_image_origin": "CGI fallback visual",
                  "source_image_content_type": "image/jpeg",
                  "attempts_before_success": [],
                  "is_fallback_visual": True,
              }

          def summarize(summary, max_len=260):
              txt = strip_tags(summary)
              if not txt:
                  return "Korte samenvatting niet beschikbaar in de feed; open de bron voor de volledige context."
              if len(txt) <= max_len:
                  return txt
              cut = txt[:max_len].rsplit(" ", 1)[0]
              return cut + "..."

          def cgi_angle(item):
              topics = set(item.get("topics", []))
              if "Nederland & Europese markt" in topics and "Retail & Consumer Services" in topics:
                  return "CGI Angle: relevant voor de Nederlandse/Benelux-markt omdat dit dichter bij klanten, merken, partners en platformen ligt waarmee CGI Retail & Consumer Services te maken krijgt. Bruikbaar voor lokale klantgesprekken over digitale strategie, IT-modernisering, data, commerce en AI-adoptie."
              if "Retail & Consumer Services" in topics and "AI Agents & Automation" in topics:
                  return "CGI Angle: relevant omdat AI-agents dichter bij winkel-, service-, supply-chain- en backofficeprocessen komen. Voor CGI is dit bruikbaar in gesprekken over procesautomatisering, integratie met bestaande retailplatformen, governance en schaalbare delivery."
              if "Retail & Consumer Services" in topics and "Customer, Loyalty & CX" in topics:
                  return "CGI Angle: relevant voor retailers en consumer-services-klanten die klantinteractie, loyalty en service slimmer willen maken. Voor CGI raakt dit aan klantdata, CRM/CDP, omnichannel journeys, consent, contactcenterintegratie en meetbare businesswaarde."
              if "Commerce Platforms & Martech" in topics or "Enterprise Architecture & Integration" in topics:
                  return "CGI Angle: relevant omdat veel RCS-klantvragen landen op commerceplatformen, martech, CRM/CDP, PIM/OMS en integratie. Dit artikel kan helpen bij gesprekken over platformkeuzes, composable commerce, datakwaliteit en migratie-roadmaps."
              if "Supply Chain & Forecasting" in topics or "Store Operations" in topics:
