name: CGI AI Retail & Consumer Services Weekstream - IDEAL

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 5"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cgi-ai-rcs-weekstream
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install image support
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Generate CGI AI Retail & Consumer Services weekstream
        run: |
          python3 - <<'PY'
          import base64
          import email.utils
          import hashlib
          import html
          import io
          import json
          import os
          import re
          import sys
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from PIL import Image, ImageOps, UnidentifiedImageError

          VERSION = "v13.0-ideal-cgi-rcs-source-images"
          ACCESS_CODE = "NT2026!"
          LOOKBACK_HOURS = 168
          MAX_PUBLISHED_ARTICLES = 36
          MAX_FEED_ITEMS_PER_SOURCE = 50
          MIN_RELEVANCE_SCORE = 7.0
          HTTP_TIMEOUT = 16
          MAX_HTML_BYTES = 2_500_000
          MAX_IMAGE_BYTES = 7_000_000
          MIN_IMAGE_WIDTH = 320
          MIN_IMAGE_HEIGHT = 180
          OUTPUT_DIR = Path("site")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0 Safari/537.36 CGI-RCS-AI-Weekstream/13.0"
          )

          # Redactionele scope:
          # AI-focussed news met praktische/strategische relevantie voor CGI IT/AI-toepassingen
          # binnen Retail & Consumer Services. Algemene AI-artikelen worden alleen meegenomen als
          # ze relevant zijn voor enterprise IT, data/platform, governance, agents/automation,
          # klantinteractie, commerce, store operations, supply chain of vendor roadmaps.
          SOURCES = [
              {
                  "name": "TechCrunch AI",
                  "kind": "AI news",
                  "feeds": ["https://techcrunch.com/category/artificial-intelligence/feed/"],
                  "boost": 1.0,
              },
              {
                  "name": "The Verge AI",
                  "kind": "AI news",
                  "feeds": ["https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"],
                  "boost": 0.8,
              },
              {
                  "name": "WIRED AI",
                  "kind": "AI news",
                  "feeds": ["https://www.wired.com/feed/tag/artificial-intelligence/latest/rss"],
                  "boost": 0.8,
              },
              {
                  "name": "OpenAI News",
                  "kind": "AI lab",
                  "feeds": ["https://openai.com/news/rss.xml"],
                  "boost": 1.6,
              },
              {
                  "name": "Google DeepMind Blog",
                  "kind": "AI lab",
                  "feeds": ["https://deepmind.google/blog/rss.xml"],
                  "boost": 1.5,
              },
              {
                  "name": "Anthropic News",
                  "kind": "AI lab",
                  "feeds": ["https://www.anthropic.com/news/rss.xml", "https://www.anthropic.com/rss.xml"],
                  "boost": 1.5,
              },
              {
                  "name": "VentureBeat AI",
                  "kind": "Enterprise AI",
                  "feeds": ["https://venturebeat.com/category/ai/feed/"],
                  "boost": 1.4,
              },
              {
                  "name": "The Decoder",
                  "kind": "AI news",
                  "feeds": ["https://the-decoder.com/feed/"],
                  "boost": 1.0,
              },
              {
                  "name": "NVIDIA AI Blog",
                  "kind": "Enterprise AI",
                  "feeds": ["https://blogs.nvidia.com/blog/category/deep-learning/feed/", "https://blogs.nvidia.com/feed/"],
                  "boost": 1.3,
              },
              {
                  "name": "AWS Machine Learning Blog",
                  "kind": "Enterprise AI",
                  "feeds": ["https://aws.amazon.com/blogs/machine-learning/feed/"],
                  "boost": 1.4,
              },
              {
                  "name": "Google Cloud AI",
                  "kind": "Enterprise AI",
                  "feeds": ["https://cloud.google.com/blog/products/ai-machine-learning/rss/"],
                  "boost": 1.4,
              },
              {
                  "name": "Retail Dive",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://www.retaildive.com/feeds/news/"],
                  "boost": 1.6,
              },
              {
                  "name": "Modern Retail",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://www.modernretail.co/feed/"],
                  "boost": 1.5,
              },
              {
                  "name": "RetailWire",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://retailwire.com/feed/"],
                  "boost": 1.4,
              },
              {
                  "name": "Grocery Dive",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://www.grocerydive.com/feeds/news/"],
                  "boost": 1.4,
              },
              {
                  "name": "Digital Commerce 360",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://www.digitalcommerce360.com/feed/"],
                  "boost": 1.4,
              },
              {
                  "name": "NRF",
                  "kind": "Retail & Consumer Services",
                  "feeds": ["https://nrf.com/rss.xml"],
                  "boost": 1.2,
              },
          ]

          AI_TERMS = {
              "ai", "artificial intelligence", "generative ai", "genai", "llm", "large language model",
              "foundation model", "model", "multimodal", "agent", "agents", "ai agent", "agentic",
              "automation", "copilot", "chatbot", "computer vision", "machine learning", "deep learning",
              "reasoning", "robotics", "synthetic data", "inference", "training", "open source model",
              "voice ai", "search ai", "recommendation", "personalization", "personalisation",
          }
          RCS_TERMS = {
              "retail", "retailer", "commerce", "ecommerce", "e-commerce", "consumer", "consumer services",
              "customer", "loyalty", "store", "stores", "shopper", "shopping", "grocery", "supermarket",
              "marketplace", "omnichannel", "merchandising", "pricing", "promotion", "retail media",
              "checkout", "pos", "inventory", "supply chain", "fulfillment", "fulfilment", "last mile",
              "returns", "warehouse", "forecast", "demand planning", "assortment", "product data",
              "customer service", "contact center", "personalization", "loyalty program",
          }
          ENTERPRISE_TERMS = {
              "enterprise", "business", "platform", "cloud", "data", "architecture", "integration",
              "api", "security", "privacy", "governance", "responsible ai", "compliance", "risk",
              "workflow", "productivity", "operations", "implementation", "adoption", "deployment",
              "cost", "performance", "infrastructure", "cybersecurity", "identity", "database",
              "erp", "crm", "sap", "salesforce", "adobe", "azure", "aws", "google cloud", "service now",
          }
          VENDOR_TERMS = {
              "openai", "chatgpt", "gpt", "claude", "anthropic", "gemini", "deepmind", "microsoft",
              "copilot", "azure", "aws", "amazon", "google cloud", "nvidia", "salesforce", "adobe",
              "sap", "oracle", "servicenow", "meta", "llama", "hugging face",
          }
          EXCLUDE_IF_ONLY = {
              "funding", "fundraise", "raises", "raised", "valuation", "ipo", "lawsuit", "celebrity",
              "rumor", "rumour", "stock", "share price", "crypto", "gaming", "movie", "music",
          }

          TOPIC_RULES = [
              ("Retail & Consumer Services", RCS_TERMS),
              ("AI Agents & Automation", {"agent", "agents", "agentic", "automation", "workflow", "autonomous", "copilot", "assistant"}),
              ("GenAI & Foundation Models", {"generative ai", "genai", "llm", "foundation model", "model", "multimodal", "gpt", "claude", "gemini", "llama", "reasoning"}),
              ("Customer & Loyalty", {"customer", "loyalty", "personalization", "personalisation", "service", "contact center", "recommendation", "experience", "shopper"}),
              ("Store Operations", {"store", "checkout", "pos", "associate", "robotics", "computer vision", "loss prevention", "queue", "operations"}),
              ("Supply Chain & Forecasting", {"inventory", "supply chain", "forecast", "demand planning", "warehouse", "fulfillment", "fulfilment", "last mile"}),
              ("Pricing & Merchandising", {"pricing", "promotion", "merchandising", "assortment", "retail media", "marketplace", "product data"}),
              ("Data, Platforms & Cloud", {"data", "platform", "cloud", "architecture", "api", "integration", "database", "infrastructure", "azure", "aws", "google cloud"}),
              ("Governance, Risk & Responsible AI", {"governance", "responsible ai", "safety", "privacy", "security", "compliance", "risk", "regulation", "trust", "cybersecurity"}),
              ("Research & Market Signals", {"research", "benchmark", "study", "report", "survey", "market", "trend", "index", "paper", "launch"}),
          ]

          def log(msg):
              print(msg, flush=True)

          def now_utc():
              return datetime.now(timezone.utc)

          def normalize_space(s):
              return re.sub(r"\s+", " ", (s or "")).strip()

          def strip_tags(s):
              s = re.sub(r"<script[\s\S]*?</script>", " ", s or "", flags=re.I)
              s = re.sub(r"<style[\s\S]*?</style>", " ", s, flags=re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              return normalize_space(html.unescape(s))

          def clean_url(url):
              if not url:
                  return ""
              try:
                  p = urllib.parse.urlsplit(url.strip())
                  q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query, keep_blank_values=True) if not k.lower().startswith("utm_")]
                  return urllib.parse.urlunsplit((p.scheme, p.netloc.lower(), p.path.rstrip("/"), urllib.parse.urlencode(q), ""))
              except Exception:
                  return url.strip()

          def request_bytes(url, max_bytes, timeout=HTTP_TIMEOUT, referer=None):
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9,nl;q=0.8",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  ctype = resp.headers.get("content-type", "")
                  data = resp.read(max_bytes + 1)
                  if len(data) > max_bytes:
                      raise ValueError(f"response too large > {max_bytes}")
                  return data, ctype

          def request_text(url, max_bytes=MAX_HTML_BYTES, timeout=HTTP_TIMEOUT):
              data, ctype = request_bytes(url, max_bytes=max_bytes, timeout=timeout)
              m = re.search(r"charset=([^;]+)", ctype or "", flags=re.I)
              enc = m.group(1).strip() if m else "utf-8"
              try:
                  return data.decode(enc, errors="replace"), ctype
              except Exception:
                  return data.decode("utf-8", errors="replace"), ctype

          def tag_name(elem):
              return elem.tag.split("}")[-1].lower() if isinstance(elem.tag, str) else ""

          def find_child_text(elem, names):
              wanted = {n.lower() for n in names}
              for child in list(elem):
                  if tag_name(child) in wanted:
                      return normalize_space("".join(child.itertext()))
              return ""

          def find_link(elem):
              # RSS link text first
              for child in list(elem):
                  if tag_name(child) == "link":
                      href = child.attrib.get("href")
                      if href:
                          return href
                      txt = normalize_space("".join(child.itertext()))
                      if txt:
                          return txt
              return ""

          def parse_date(raw):
              raw = normalize_space(raw)
              if not raw:
                  return None
              try:
                  dt = email.utils.parsedate_to_datetime(raw)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  pass
              for fmt in ["%Y-%m-%dT%H:%M:%SZ", "%Y-%m-%dT%H:%M:%S%z", "%Y-%m-%d"]:
                  try:
                      dt = datetime.strptime(raw[:25], fmt)
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except Exception:
                      pass
              return None

          def extract_image_candidates_from_html_fragment(fragment, base_url, origin):
              out = []
              for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original)=['\"]([^'\"]+)['\"]", fragment or "", flags=re.I):
                  url = html.unescape(m.group(1))
                  if url.startswith("data:"):
                      continue
                  out.append({"url": urllib.parse.urljoin(base_url, url), "origin": origin})
              return out

          def extract_rss_image_candidates(item, article_url):
              candidates = []
              for el in item.iter():
                  name = tag_name(el)
                  attrs = {k.lower().split("}")[-1]: v for k, v in el.attrib.items()}
                  if name in {"content", "thumbnail", "image"} and attrs.get("url"):
                      candidates.append({"url": urllib.parse.urljoin(article_url, attrs["url"]), "origin": f"rss:{name}"})
                  if name == "enclosure" and attrs.get("url"):
                      typ = attrs.get("type", "")
                      if "image" in typ.lower() or re.search(r"\.(jpe?g|png|webp|gif|avif)(\?|$)", attrs["url"], flags=re.I):
                          candidates.append({"url": urllib.parse.urljoin(article_url, attrs["url"]), "origin": "rss:enclosure"})
                  if name == "image":
                      href = attrs.get("href") or attrs.get("url")
                      if href:
                          candidates.append({"url": urllib.parse.urljoin(article_url, href), "origin": "rss:image"})
              summary_html = find_child_text(item, ["description", "summary", "content", "encoded"])
              candidates.extend(extract_image_candidates_from_html_fragment(summary_html, article_url, "rss:html"))
              # Remove duplicates while preserving order.
              seen = set()
              unique = []
              for c in candidates:
                  u = clean_url(c.get("url"))
                  if u and u not in seen:
                      seen.add(u)
                      unique.append({"url": u, "origin": c.get("origin", "rss")})
              return unique

          def parse_feed(xml_text, source):
              root = ET.fromstring(xml_text)
              items = []
              nodes = [el for el in root.iter() if tag_name(el) in {"item", "entry"}]
              for node in nodes[:MAX_FEED_ITEMS_PER_SOURCE]:
                  title = find_child_text(node, ["title"])
                  url = find_link(node)
                  if not title or not url:
                      continue
                  summary_html = ""
                  for n in ["description", "summary", "content", "encoded"]:
                      txt = find_child_text(node, [n])
                      if txt:
                          summary_html = txt
                          break
                  summary = strip_tags(summary_html)
                  date_raw = find_child_text(node, ["pubDate", "published", "updated", "date"])
                  published = parse_date(date_raw) or now_utc()
                  cats = []
                  for el in node.iter():
                      if tag_name(el) == "category":
                          txt = normalize_space("".join(el.itertext())) or el.attrib.get("term", "")
                          if txt:
                              cats.append(txt)
                  url = clean_url(urllib.parse.urljoin(source["feeds"][0], html.unescape(url)))
                  items.append({
                      "source": source["name"],
                      "source_kind": source["kind"],
                      "source_boost": float(source.get("boost", 1.0)),
                      "title": strip_tags(title),
                      "url": url,
                      "summary": summary,
                      "published": published,
                      "categories": cats[:8],
                      "rss_image_candidates": extract_rss_image_candidates(node, url),
                  })
              return items

          def count_terms(text, terms):
              text_l = f" {text.lower()} "
              score = 0
              hits = []
              for term in terms:
                  term_l = term.lower()
                  if " " in term_l or "-" in term_l:
                      if term_l in text_l:
                          score += 1
                          hits.append(term)
                  else:
                      if re.search(r"\b" + re.escape(term_l) + r"\b", text_l):
                          score += 1
                          hits.append(term)
              return score, hits

          def classify_and_score(item):
              text = " ".join([item["title"], item["summary"], " ".join(item.get("categories", [])), item["source"], item["source_kind"]])
              ai_score, ai_hits = count_terms(text, AI_TERMS)
              rcs_score, rcs_hits = count_terms(text, RCS_TERMS)
              enterprise_score, enterprise_hits = count_terms(text, ENTERPRISE_TERMS)
              vendor_score, vendor_hits = count_terms(text, VENDOR_TERMS)
              exclude_score, exclude_hits = count_terms(text, EXCLUDE_IF_ONLY)

              source_kind = item.get("source_kind", "")
              score = 0.0
              score += min(ai_score, 5) * 2.2
              score += min(rcs_score, 6) * 2.0
              score += min(enterprise_score, 5) * 1.5
              score += min(vendor_score, 4) * 0.8
              score += item.get("source_boost", 1.0)
              if source_kind == "Retail & Consumer Services":
                  score += 2.2
              if source_kind in {"Enterprise AI", "AI lab"}:
                  score += 1.4
              if ai_score > 0 and rcs_score > 0:
                  score += 3.0
              if ai_score > 0 and enterprise_score > 0:
                  score += 2.0
              if rcs_score > 0 and enterprise_score > 0:
                  score += 1.5
              if exclude_score > 0 and (enterprise_score + rcs_score + ai_score) < 4:
                  score -= 4.0

              # Hard editorial gates: no pure retail news without AI/IT angle; no broad AI without enterprise/RCS angle.
              eligible = False
              if source_kind == "Retail & Consumer Services":
                  eligible = (ai_score >= 1 or enterprise_score >= 2 or vendor_score >= 1) and rcs_score >= 1
              elif source_kind in {"AI lab", "Enterprise AI"}:
                  eligible = ai_score >= 1 and (enterprise_score >= 1 or rcs_score >= 1 or vendor_score >= 1)
              else:
                  eligible = ai_score >= 1 and (enterprise_score >= 1 or rcs_score >= 1)

              topics = []
              topic_hits = {}
              for topic, terms in TOPIC_RULES:
                  n, hits = count_terms(text, terms)
                  if n:
                      topics.append(topic)
                      topic_hits[topic] = hits[:5]
              if not topics:
                  topics = ["Research & Market Signals"]

              tags = []
              for t in topics[:4]:
                  tags.append(t)
              for h in (ai_hits + rcs_hits + enterprise_hits + vendor_hits):
                  pretty = h.strip().title()
                  if pretty not in tags and len(tags) < 8:
                      tags.append(pretty)

              item["score"] = round(score, 2)
              item["eligible"] = eligible and score >= MIN_RELEVANCE_SCORE
              item["topics"] = topics
              item["tags"] = tags[:8]
              item["score_detail"] = {
                  "ai": ai_score,
                  "retail_consumer_services": rcs_score,
                  "enterprise_it": enterprise_score,
                  "vendor": vendor_score,
                  "exclude": exclude_score,
                  "hits": {
                      "ai": ai_hits[:8],
                      "retail_consumer_services": rcs_hits[:8],
                      "enterprise_it": enterprise_hits[:8],
                      "vendor": vendor_hits[:8],
                      "exclude": exclude_hits[:5],
                  },
              }
              return item

          def fetch_article_image_candidates(article_url):
              try:
                  page, ctype = request_text(article_url, max_bytes=MAX_HTML_BYTES)
              except Exception as e:
                  return [], f"article page fetch failed: {e}"
              candidates = []
              # Open Graph / Twitter card.
              patterns = [
                  r"<meta[^>]+(?:property|name)=['\"]og:image(?::secure_url)?['\"][^>]+content=['\"]([^'\"]+)['\"]",
                  r"<meta[^>]+content=['\"]([^'\"]+)['\"][^>]+(?:property|name)=['\"]og:image(?::secure_url)?['\"]",
                  r"<meta[^>]+(?:property|name)=['\"]twitter:image(?::src)?['\"][^>]+content=['\"]([^'\"]+)['\"]",
                  r"<meta[^>]+content=['\"]([^'\"]+)['\"][^>]+(?:property|name)=['\"]twitter:image(?::src)?['\"]",
              ]
              for pat in patterns:
                  for m in re.finditer(pat, page, flags=re.I):
                      candidates.append({"url": urllib.parse.urljoin(article_url, html.unescape(m.group(1))), "origin": "article:meta"})
              # JSON-LD image fields.
              for script_match in re.finditer(r"<script[^>]+type=['\"]application/ld\+json['\"][^>]*>([\s\S]*?)</script>", page, flags=re.I):
                  blob = html.unescape(script_match.group(1))
                  for m in re.finditer(r'"image"\s*:\s*"([^"\\]+)"', blob):
                      candidates.append({"url": urllib.parse.urljoin(article_url, m.group(1)), "origin": "article:jsonld"})
                  for m in re.finditer(r'"url"\s*:\s*"([^"\\]+\.(?:jpg|jpeg|png|webp|gif|avif)(?:\?[^"\\]*)?)"', blob, flags=re.I):
                      candidates.append({"url": urllib.parse.urljoin(article_url, m.group(1)), "origin": "article:jsonld"})
              # Last resort: visible article images.
              for m in re.finditer(r"<img[^>]+(?:src|data-src|data-original)=['\"]([^'\"]+)['\"][^>]*>", page, flags=re.I):
                  raw = html.unescape(m.group(1))
                  if raw.startswith("data:"):
                      continue
                  if any(x in raw.lower() for x in ["logo", "avatar", "icon", "sprite", "tracking", "pixel"]):
                      continue
                  candidates.append({"url": urllib.parse.urljoin(article_url, raw), "origin": "article:img"})
              seen = set()
              unique = []
              for c in candidates:
                  u = clean_url(c.get("url"))
                  if not u or u in seen:
                      continue
                  seen.add(u)
                  unique.append({"url": u, "origin": c.get("origin", "article")})
              return unique[:12], ""

          def source_image_to_data_uri(candidates, article_url):
              reasons = []
              for c in candidates[:16]:
                  url = c.get("url")
                  origin = c.get("origin", "unknown")
                  try:
                      data, ctype = request_bytes(url, max_bytes=MAX_IMAGE_BYTES, referer=article_url)
                      if len(data) < 3000:
                          reasons.append(f"{origin}: too small")
                          continue
                      img = Image.open(io.BytesIO(data))
                      img = ImageOps.exif_transpose(img)
                      if img.width < MIN_IMAGE_WIDTH or img.height < MIN_IMAGE_HEIGHT:
                          reasons.append(f"{origin}: dimensions {img.width}x{img.height} too small")
                          continue
                      img = img.convert("RGB")
                      # Center crop to 16:9 and save as safe JPEG.
                      target_ratio = 16 / 9
                      ratio = img.width / img.height
                      if ratio > target_ratio:
                          new_w = int(img.height * target_ratio)
                          left = (img.width - new_w) // 2
                          img = img.crop((left, 0, left + new_w, img.height))
                      elif ratio < target_ratio:
                          new_h = int(img.width / target_ratio)
                          top = (img.height - new_h) // 2
                          img = img.crop((0, top, img.width, top + new_h))
                      img = img.resize((1200, 675), Image.LANCZOS)
                      out = io.BytesIO()
                      img.save(out, format="JPEG", quality=82, optimize=True)
                      b64 = base64.b64encode(out.getvalue()).decode("ascii")
                      return {
                          "ok": True,
                          "data_uri": f"data:image/jpeg;base64,{b64}",
                          "source_image_url": url,
                          "source_image_origin": origin,
                          "source_image_content_type": ctype,
                          "attempts_before_success": reasons[:10],
                      }
                  except UnidentifiedImageError:
                      reasons.append(f"{origin}: not decodable image")
                  except Exception as e:
                      reasons.append(f"{origin}: {str(e)[:140]}")
              return {"ok": False, "reasons": reasons[:14]}

          def summarize(summary, max_len=260):
              txt = strip_tags(summary)
              if not txt:
                  return "Korte samenvatting niet beschikbaar in de feed; open de bron voor de volledige context."
              if len(txt) <= max_len:
                  return txt
              cut = txt[:max_len].rsplit(" ", 1)[0]
              return cut + "..."

          def cgi_angle(item):
              topics = set(item.get("topics", []))
              title = item.get("title", "")
              if "Retail & Consumer Services" in topics and "AI Agents & Automation" in topics:
                  return "CGI Angle: relevant voor Retail & Consumer Services omdat AI-agents steeds dichter bij echte winkel-, service- en backofficeprocessen komen. Goed bruikbaar voor klantgesprekken over procesautomatisering, governance, integratie met bestaande platformen en de stap van pilot naar schaalbare operatie."
              if "Retail & Consumer Services" in topics and "Customer & Loyalty" in topics:
                  return "CGI Angle: relevant voor retailers en consumer-services-klanten die AI willen inzetten voor betere klantinteractie, personalisatie en service. Voor CGI is dit vooral waardevol in gesprekken over klantdata, omnichannel journeys, consent, CRM/CDP-koppelingen en meetbare businesswaarde."
              if "Supply Chain & Forecasting" in topics or "Store Operations" in topics:
                  return "CGI Angle: interessant voor klanten die AI willen toepassen in operationele retailprocessen zoals voorraad, forecasting, winkeloperatie of fulfilment. Dit raakt direct aan data readiness, integratie met ERP/POS/WMS-systemen en betrouwbare delivery in de operatie."
              if "Governance, Risk & Responsible AI" in topics:
                  return "CGI Angle: belangrijk voor CGI omdat AI-adoptie bij retailklanten alleen schaalbaar wordt met duidelijke governance, privacy, security en verantwoord gebruik. Dit artikel is bruikbaar als signaal voor klantgesprekken over AI control frameworks en enterprise-ready implementatie."
              if "Data, Platforms & Cloud" in topics:
                  return "CGI Angle: relevant voor de technische realisatie achter AI in retail en consumer services. De waarde zit vooral in platformkeuzes, cloudarchitectuur, datafundament, integraties en beheerbaarheid zodra AI-oplossingen voorbij de proof-of-conceptfase gaan."
              if "GenAI & Foundation Models" in topics:
                  return "CGI Angle: goed om te volgen omdat modelontwikkelingen invloed hebben op wat klanten verwachten van AI-functionaliteit, kosten, performance en vendor-roadmaps. Voor CGI helpt dit bij het positioneren van haalbare AI-use-cases en architectuurkeuzes."
              return "CGI Angle: relevant als marktsignaal voor hoe AI zich ontwikkelt richting enterprise-toepassing. Voor CGI Retail & Consumer Services is dit vooral nuttig om klantvragen, vendor-roadmaps en toekomstige AI-proposities beter te duiden."

          def source_icon(kind):
              if kind == "Retail & Consumer Services":
                  return "RCS"
              if kind == "AI lab":
                  return "LAB"
              if kind == "Enterprise AI":
                  return "IT"
              return "AI"

          def html_escape(s):
              return html.escape(str(s or ""), quote=True)

          def build_week_summary(articles, topic_counts):
              top_topics = [t for t, c in sorted(topic_counts.items(), key=lambda x: (-x[1], x[0])) if c][:4]
              if not articles:
                  return "Deze week zijn er geen artikelen gepubliceerd die zowel binnen de redactionele CGI Retail & Consumer Services scope vallen als een bruikbare bronafbeelding hebben. Controleer status.json voor afgewezen artikelen en bronfeeds."
              pieces = []
              if top_topics:
                  pieces.append("De relevante AI-nieuwsstroom van deze week clustert vooral rond " + ", ".join(top_topics[:-1]) + (" en " + top_topics[-1] if len(top_topics) > 1 else top_topics[0]) + ".")
              pieces.append("Voor CGI Retail & Consumer Services ligt de waarde vooral in signalen die helpen bij klantgesprekken over AI-adoptie, data- en platformvolwassenheid, governance, customer experience, commerce en operationele retailprocessen.")
              pieces.append("De selectie hieronder is bewust strenger dan een algemene AI-feed: artikelen worden alleen getoond wanneer ze een duidelijke AI/IT/Retail-relevantie hebben én een echte bronafbeelding succesvol kon worden ingesloten.")
              return " ".join(pieces)

          def render_html(articles, status):
              generated_local = datetime.now().astimezone().strftime("%d-%m-%Y %H:%M")
              topic_counts = status.get("topics", {})
              week_summary = build_week_summary(articles, topic_counts)
              filter_topics = [
                  "Alle artikelen",
                  "Retail & Consumer Services",
                  "AI Agents & Automation",
                  "GenAI & Foundation Models",
                  "Customer & Loyalty",
                  "Store Operations",
                  "Supply Chain & Forecasting",
                  "Pricing & Merchandising",
                  "Data, Platforms & Cloud",
                  "Governance, Risk & Responsible AI",
                  "Research & Market Signals",
              ]
              filters_html = []
              for i, topic in enumerate(filter_topics):
                  data = "all" if topic == "Alle artikelen" else topic
                  active = " active" if i == 0 else ""
                  filters_html.append(f'<button class="filter{active}" data-filter="{html_escape(data)}">{html_escape(topic)}</button>')

              cards = []
              for idx, a in enumerate(articles, 1):
                  topic_attr = "|".join(a.get("topics", []))
                  tags = "".join([f'<button class="tag" data-filter="{html_escape(t)}">{html_escape(t)}</button>' for t in a.get("tags", [])])
                  published = a["published"].strftime("%d %b %Y")
                  cards.append(f'''
                  <article class="card" data-topics="{html_escape(topic_attr)}">
                    <div class="image-wrap">
                      <img src="{a['image_data_uri']}" alt="Bronafbeelding bij {html_escape(a['title'])}" loading="lazy">
                      <div class="image-label">Bronbeeld · {html_escape(a.get('source_image_origin', 'source'))}</div>
                    </div>
                    <div class="card-body">
                      <div class="meta"><span>{html_escape(a['source'])}</span><span>{html_escape(published)}</span><span>{html_escape(source_icon(a['source_kind']))}</span></div>
                      <h3>{html_escape(a['title'])}</h3>
                      <p class="summary">{html_escape(a['short_summary'])}</p>
                      <p class="angle">{html_escape(a['cgi_angle'])}</p>
                      <div class="tags">{tags}</div>
                      <a class="source-button" href="{html_escape(a['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel →</a>
                    </div>
                  </article>
                  ''')
              article_html = "\n".join(cards)

              retail_cards = []
              for a in [x for x in articles if "Retail & Consumer Services" in x.get("topics", [])][:18]:
                  retail_cards.append(f'''
                  <li>
                    <a href="{html_escape(a['url'])}" target="_blank" rel="noopener noreferrer">{html_escape(a['title'])}</a>
                    <span>{html_escape(a['source'])}</span>
                  </li>''')
              retail_html = "\n".join(retail_cards) or "<li>Geen aparte retailartikelen binnen de strenge source-image selectie.</li>"

              login_code_hash = hashlib.sha256(ACCESS_CODE.encode("utf-8")).hexdigest()
              source_names = sorted({a["source"] for a in articles})
              source_summary = ", ".join(source_names[:18])
              if len(source_names) > 18:
                  source_summary += f" en {len(source_names)-18} meer"

              css = r'''
              :root{
                --cgi-red:#e31937; --cgi-purple:#5236ab; --cgi-black:#000; --cgi-white:#fff;
                --ink:#111217; --muted:#5e6272; --line:#e8e8ee; --soft:#f7f7fb; --panel:#ffffff;
                --shadow:0 18px 45px rgba(0,0,0,.10);
              }
              *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fff 0,#faf9fc 55%,#fff 100%);color:var(--ink)}
              a{color:inherit}.gate{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple));display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
              .gate-box{width:min(520px,100%);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
              .gate-logo{font-weight:900;font-size:30px;letter-spacing:-.04em}.gate h1{font-size:34px;line-height:1.05;margin:18px 0 10px}.gate p{opacity:.92;line-height:1.5}.gate input{width:100%;border:0;border-radius:16px;padding:16px 18px;margin:12px 0;font-size:18px}.gate button{border:0;border-radius:999px;background:#fff;color:#111;padding:14px 20px;font-weight:800;cursor:pointer}.gate .error{display:none;color:#ffdfe4;font-weight:700}.hidden{display:none!important}
              .hero{background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple));color:#fff;padding:42px 20px 54px}.hero-inner{max-width:1180px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:34px;font-weight:950;letter-spacing:-.05em}.version{font-size:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;opacity:.9}.hero h1{font-size:clamp(36px,7vw,76px);letter-spacing:-.06em;line-height:.92;margin:45px 0 18px;max-width:920px}.hero p{font-size:clamp(16px,2vw,21px);line-height:1.5;max-width:920px;opacity:.94}.stat{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:999px;padding:13px 18px;font-weight:900;margin-top:22px}.content{max-width:1180px;margin:-32px auto 80px;padding:0 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:28px;margin-bottom:24px}.panel h2{font-size:28px;letter-spacing:-.03em;margin:0 0 12px}.panel p{color:#303240;line-height:1.65}.source-note{font-size:13px;color:var(--muted);margin-top:14px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.filter,.tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:750;cursor:pointer;color:#222}.filter.active,.tag:hover{background:var(--cgi-purple);color:#fff;border-color:var(--cgi-purple)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.06);display:flex;flex-direction:column}.image-wrap{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.image-wrap img{width:100%;height:100%;display:block;object-fit:cover}.image-label{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:7px 10px}.card-body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.meta span{background:var(--soft);border-radius:999px;padding:6px 9px}.card h3{font-size:21px;line-height:1.12;letter-spacing:-.03em;margin:0}.summary{margin:0;color:#3d4050;line-height:1.5}.angle{margin:0;background:#fbf4f6;border-left:4px solid var(--cgi-red);padding:13px 14px;border-radius:14px;color:#222;line-height:1.45;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{font-size:12px;padding:7px 10px}.source-button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--cgi-red);color:#fff;border-radius:999px;padding:13px 16px;font-weight:900;margin-top:auto;transition:transform .15s ease,box-shadow .15s ease}.source-button:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(227,25,55,.25)}.retail-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}.retail-list li{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.retail-list a{font-weight:850;text-decoration:none}.retail-list span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.empty{padding:22px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#fff}.footer{max-width:1180px;margin:0 auto 40px;padding:0 20px;color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{max-width:760px}}@media(max-width:640px){.grid{grid-template-columns:1fr}.content{padding:0 14px}.panel{padding:20px;border-radius:22px}.hero{padding:30px 14px 44px}.brand{align-items:flex-start;flex-direction:column}.hero h1{font-size:42px}.gate-box{padding:24px;border-radius:22px}}
              '''
              js = f'''
              const ACCESS_HASH = "{login_code_hash}";
              async function sha256(text) {{
                const data = new TextEncoder().encode(text);
                const hash = await crypto.subtle.digest('SHA-256', data);
                return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
              }}
              async function unlock() {{
                const value = document.getElementById('accessCode').value || '';
                const digest = await sha256(value);
                if (digest === ACCESS_HASH) {{
                  sessionStorage.setItem('cgi_ai_weekstream_access','ok');
                  document.getElementById('gate').classList.add('hidden');
                  document.getElementById('app').classList.remove('hidden');
                }} else {{ document.getElementById('loginError').style.display = 'block'; }}
              }}
              function applyFilter(topic) {{
                document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.filter === topic));
                document.querySelectorAll('.card').forEach(card => {{
                  const topics = card.dataset.topics || '';
                  card.style.display = (topic === 'all' || topics.includes(topic)) ? '' : 'none';
                }});
              }}
              document.addEventListener('DOMContentLoaded', () => {{
                if (sessionStorage.getItem('cgi_ai_weekstream_access') === 'ok') {{
                  document.getElementById('gate').classList.add('hidden');
                  document.getElementById('app').classList.remove('hidden');
                }}
                document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => applyFilter(el.dataset.filter)));
                document.getElementById('accessCode')?.addEventListener('keydown', e => {{ if (e.key === 'Enter') unlock(); }});
              }});
              '''
              count = len(articles)
              if count == 0:
                  article_html = '<div class="empty">Geen artikelen gepubliceerd binnen de strenge combinatie van CGI RCS-relevantie en werkende bronafbeelding. Controleer status.json voor diagnose.</div>'
              return f'''<!doctype html>
              <html lang="nl">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <meta name="robots" content="noindex,nofollow">
                <title>CGI AI Retail & Consumer Services Weekstream</title>
                <style>{css}</style>
              </head>
              <body>
                <section id="gate" class="gate">
                  <div class="gate-box">
                    <div class="gate-logo">CGI</div>
                    <h1>AI Retail & Consumer Services Weekstream</h1>
                    <p>Voer de toegangscode in om de wekelijkse briefing te openen.</p>
                    <input id="accessCode" type="password" placeholder="Toegangscode" autocomplete="current-password">
                    <button onclick="unlock()">Open briefing</button>
                    <p id="loginError" class="error">Onjuiste code. Controleer hoofdletters en leestekens.</p>
                  </div>
                </section>
                <main id="app" class="hidden">
                  <header class="hero">
                    <div class="hero-inner">
                      <div class="brand"><div class="logo">CGI</div><div class="version">{VERSION}</div></div>
                      <h1>AI Weekstream voor Retail & Consumer Services</h1>
                      <p>AI-focussed news met praktische relevantie voor CGI IT- en AI-toepassingen binnen retail, commerce, customer experience en consumer services.</p>
                      <div class="stat">{count} relevante artikelen</div>
                    </div>
                  </header>
                  <section class="content">
                    <section class="panel">
                      <h2>Weeksamenvatting</h2>
                      <p>{html_escape(week_summary)}</p>
                      <div class="source-note">Scope: AI-ontwikkelingen met relevantie voor CGI Retail & Consumer Services. Bronbeelden zijn verplicht; artikelen zonder downloadbare bronafbeelding worden niet gepubliceerd.</div>
                    </section>
                    <section class="panel">
                      <h2>Filter op topic</h2>
                      <div class="filters">{''.join(filters_html)}</div>
                    </section>
                    <section class="grid" id="articleGrid">{article_html}</section>
                    <section class="panel" style="margin-top:24px">
                      <h2>Retail & Consumer Services: relevante artikelen</h2>
                      <ul class="retail-list">{retail_html}</ul>
                    </section>
                  </section>
                  <footer class="footer">
                    Gegenereerd op {html_escape(generated_local)}. Bronnen met gepubliceerde artikelen: {html_escape(source_summary)}. De login-code is een lichte statische toegangsdrempel, geen enterprise-authenticatie.
                  </footer>
                </main>
                <script>{js}</script>
              </body></html>'''

          def main():
              log(f"WORKFLOW_VERSION: {VERSION}")
              cutoff = now_utc() - timedelta(hours=LOOKBACK_HOURS)
              source_status = []
              raw_items = []
              for source in SOURCES:
                  log(f"SOURCE: {source['name']} | {source['kind']}")
                  ok = False
                  items_for_source = []
                  errors = []
                  for feed in source["feeds"]:
                      log(f"  FEED: {feed}")
                      try:
                          xml_text, ctype = request_text(feed, max_bytes=MAX_HTML_BYTES)
                          items = parse_feed(xml_text, source)
                          items_for_source.extend(items)
                          ok = True
                          if items:
                              break
                      except Exception as e:
                          errors.append(f"{feed}: {e}")
                  recent = [x for x in items_for_source if x.get("published") and x["published"] >= cutoff]
                  raw_items.extend(recent)
                  source_status.append({
                      "source": source["name"],
                      "kind": source["kind"],
                      "ok": ok,
                      "items_total": len(items_for_source),
                      "items_recent": len(recent),
                      "error": " | ".join(errors[:2]),
                  })

              dedup = {}
              for item in raw_items:
                  key = clean_url(item["url"])
                  if not key:
                      continue
                  if key not in dedup or item.get("published", now_utc()) > dedup[key].get("published", now_utc()):
                      dedup[key] = item
              candidates = [classify_and_score(x) for x in dedup.values()]
              scored = [x for x in candidates if x.get("eligible")]
              scored.sort(key=lambda x: (x.get("score", 0), x.get("published", now_utc())), reverse=True)

              published = []
              rejected_no_image = []
              for item in scored:
                  if len(published) >= MAX_PUBLISHED_ARTICLES:
                      break
                  candidates_img = list(item.get("rss_image_candidates", []))
                  page_candidates, page_error = fetch_article_image_candidates(item["url"])
                  candidates_img.extend(page_candidates)
                  # De-duplicate candidates.
                  seen = set()
                  unique = []
                  for c in candidates_img:
                      u = clean_url(c.get("url"))
                      if u and u not in seen:
                          seen.add(u)
                          unique.append({"url": u, "origin": c.get("origin", "source")})
                  image = source_image_to_data_uri(unique, item["url"])
                  if not image.get("ok"):
                      rejected_no_image.append({
                          "title": item["title"],
                          "source": item["source"],
                          "url": item["url"],
                          "score": item["score"],
                          "image_candidate_count": len(unique),
                          "article_page_error": page_error,
                          "image_reasons": image.get("reasons", [])[:8],
                      })
                      continue
                  item["image_data_uri"] = image["data_uri"]
                  item["source_image_url"] = image["source_image_url"]
                  item["source_image_origin"] = image["source_image_origin"]
                  item["short_summary"] = summarize(item.get("summary", ""))
                  item["cgi_angle"] = cgi_angle(item)
                  published.append(item)

              topic_counts = {}
              for a in published:
                  for t in a.get("topics", []):
                      topic_counts[t] = topic_counts.get(t, 0) + 1

              generated = now_utc()
              iso_year, iso_week, _ = generated.isocalendar()
              archive_dir = OUTPUT_DIR / "archive" / f"{iso_year}-W{iso_week:02d}"
              latest_dir = OUTPUT_DIR / "latest"
              OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
              latest_dir.mkdir(parents=True, exist_ok=True)
              archive_dir.mkdir(parents=True, exist_ok=True)

              status = {
                  "version": VERSION,
                  "generated_at_utc": generated.isoformat(),
                  "lookback_hours": LOOKBACK_HOURS,
                  "scope": "AI-focussed news relevant for CGI IT/AI toepassingen binnen Retail & Consumer Services",
                  "selection_rule": "Publish only if CGI RCS relevance score passes threshold and a real source image can be embedded.",
                  "min_relevance_score": MIN_RELEVANCE_SCORE,
                  "article_count": len(published),
                  "article_candidates_after_score": len(scored),
                  "raw_recent_items": len(raw_items),
                  "source_images_embedded": len(published),
                  "fallback_visuals": 0,
                  "strict_source_images": True,
                  "no_external_image_paths": True,
                  "image_pipeline": "RSS/article source image -> download -> crop to 16:9 -> convert to JPG -> embed as data URI",
                  "rejected_without_source_image_count": len(rejected_no_image),
                  "rejected_without_source_image_sample": rejected_no_image[:15],
                  "topics": topic_counts,
                  "sources": source_status,
                  "published_articles": [
                      {
                          "title": a["title"],
                          "source": a["source"],
                          "url": a["url"],
                          "published": a["published"].isoformat(),
                          "score": a["score"],
                          "topics": a.get("topics", []),
                          "source_image_url": a.get("source_image_url"),
                          "source_image_origin": a.get("source_image_origin"),
                          "cgi_angle": a.get("cgi_angle"),
                      }
                      for a in published
                  ],
              }
              html_doc = render_html(published, status)
              for target in [OUTPUT_DIR, latest_dir, archive_dir]:
                  (target / "index.html").write_text(html_doc, encoding="utf-8")
                  (target / "status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
                  (target / "DEPLOYMENT_CHECK.txt").write_text(
                      f"{VERSION}\nGenerated: {generated.isoformat()}\nArticles: {len(published)}\nSource images embedded: {len(published)}\n",
                      encoding="utf-8",
                  )
              (OUTPUT_DIR / ".nojekyll").write_text("", encoding="utf-8")
              log(json.dumps({
                  "version": VERSION,
                  "article_count": len(published),
                  "source_images_embedded": len(published),
                  "rejected_without_source_image_count": len(rejected_no_image),
                  "topics": topic_counts,
              }, ensure_ascii=False, indent=2))
              if len(published) == 0:
                  log("WARNING: no articles published. The site is still deployed with diagnostic status.json.")

          if __name__ == "__main__":
              main()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
